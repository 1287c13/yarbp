<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Политика безопасности редактора.

    Главное здесь — `script-src 'self'` без `unsafe-inline`: встроенные
    обработчики (`onerror=…`) и `<script>` из пользовательских данных не
    исполняются. Редактор грузит ровно один модуль, инлайн-скриптов в разметке
    нет.

    `style-src` пока с `'unsafe-inline'`: рендереры вставляют `<style>` через
    innerHTML (рамка ТСД в FlexFormsRenderer, UI-макет в UIGenerator). Стили не
    исполняют код, поэтому это не дыра для XSS, но следующий шаг — перевести
    эти вставки на CSSOM (`adoptedStyleSheets`/`insertRule`) и убрать
    `'unsafe-inline'`. Инлайн-стилей в самой разметке уже нет (A-8).

    `blob:` в default-src нужен выгрузкам: кнопки «JSON/HTML/мок-сервер» и BPMN
    отдают файл через blob-URL. На script-src это не влияет.

    Предпросмотр формы живёт в отдельной странице (preview.html): iframe со
    `srcdoc` наследует эту политику, а страница формы собрана из встроенных
    <script>/<style>, то есть под строгой политикой не запустилась бы.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src 'self'; connect-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ЯРБП конвертер</title>
  <meta name="description" content="Онлайн конвертер ЯРБП (языка разметки для быстрого прототипирования)">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="icon" href="static/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="static/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="static/favicon-16x16.png">
</head>
<body>

<div class="top-controls">

  <div class="theme-btn">
    <div id="day-icon-box">
      <img id="day-icon" src="static/day-black.svg" alt="">
    </div>
    <hr id="theme-separator" />
    <div id="night-icon-box">
      <img id="night-icon" src="static/night-black.svg" alt="">
    </div>
  </div>
  <div class="layout-switch" id="layout-switch" role="group" aria-label="Расположение кода и результата">
    <button type="button" class="layout-switch-btn" data-layout="auto"
            title="Авто: по ориентации окна" aria-label="Авто: по ориентации окна"
            aria-pressed="true">A</button>
    <button type="button" class="layout-switch-btn" data-layout="horizontal"
            title="Горизонтально: код слева, результат справа"
            aria-label="Горизонтально: код слева, результат справа"
            aria-pressed="false">H</button>
    <button type="button" class="layout-switch-btn" data-layout="vertical"
            title="Вертикально: код сверху, результат снизу"
            aria-label="Вертикально: код сверху, результат снизу"
            aria-pressed="false">V</button>
  </div>
  <a class="github-btn"
     href="https://github.com/1287c13/yarbp"
     target="_blank"
     rel="noopener noreferrer"
     title="Исходный код на GitHub">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#111111" aria-hidden="true">
      <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18.92-.26 1.91-.38 2.9-.39.98.01 1.97.13 2.9.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56C20.22 21.38 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/>
    </svg>
  </a>
</div>

<div id="app">

  <div id="sidebar">
    <div id="file-manager-container"></div>
    <div class="sidebar-resizer" id="sidebar-resizer-first"></div>
  </div>

  <div id="work-area">

    <div id="code-pane">
      <div class="editor-container" id="code-editor-container">
        <div id="highlight-div" class="highlight-layer" contenteditable="false">
        </div>
        <label hidden for="code-textarea"></label>
        <textarea
          id="code-textarea" class="code-input" autofocus
          spellcheck="false" placeholder="Введите код..."></textarea>
      </div>
      <div class="editor-status" id="editor-status" role="status" aria-live="polite" hidden></div>
    </div>

    <div id="pane-resizer" class="pane-resizer"></div>

    <div id="render-pane">
      <div class="editor-container">
        <div id="render-highlight-div" class="highlight-layer" contenteditable="false">
        </div>
        <label hidden for="render-textarea"></label>
        <textarea
          id="render-textarea" class="code-input"
          spellcheck="false" readonly></textarea>
      </div>
    </div>

  </div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
