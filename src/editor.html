<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЯРБП конвертер</title>
  <meta name="description" content="Онлайн конвертер ЯРБП (языка разметки для быстрого прототипирования)">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>

<div class="theme-btn">
  <div id="day-icon-box">
    <img id="day-icon" src="static/day-black.svg" alt="">
  </div>
  <hr id="theme-separator" />
  <div id="night-icon-box">
    <img id="night-icon" src="static/night-black.svg" alt="">
  </div>
</div>

<div id="app">

  <div id="sidebar">
    <div id="file-manager-container"></div>
    <div class="sidebar-resizer" id="sidebar-resizer-first"></div>
  </div>

  <div id="work-area">

    <div id="code-pane">
      <div class="editor-container">
        <div id="highlight-div" class="highlight-layer" contenteditable="false">
        </div>
        <label hidden for="code-textarea"></label>
        <textarea
          id="code-textarea" class="code-input" autofocus
          spellcheck="false" placeholder="Введите код..."></textarea>
      </div>
    </div>

    <div id="pane-resizer" class="pane-resizer"></div>

    <div id="render-pane">
      <div class="editor-container">
        <div id="render-highlight-div" class="highlight-layer" contenteditable="false">
        </div>
        <label hidden for="render-textarea"></label>
        <textarea
          id="render-textarea" class="code-input"
          spellcheck="false" readonly></textarea>
      </div>
    </div>

  </div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
