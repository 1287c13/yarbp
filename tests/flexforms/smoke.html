<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>flexforms smoke</title>
<style>
  html,body{margin:0;padding:0;background:#111;color:#ddd;font:13px/1.4 monospace}
  #render-pane{position:fixed;right:0;top:0;width:460px;height:720px;border-left:1px solid #333}
  #result{padding:8px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="render-pane">
  <div class="editor-container">
    <div id="render-highlight-div" class="highlight-layer"></div>
    <textarea id="render-textarea" class="code-input"></textarea>
  </div>
</div>
<pre id="result">pending</pre>
<pre id="ir" hidden></pre>

<script type="module">
/* Дымовой тест флейвора «форма-ТСД»: реальные модули редактора, разметка —
   предопределённый пример «Форма ТСД» из «Примеров», настоящий рендерер.
   Результат печатается в #result, по нему и по <title> run_tests.py понимает,
   прошёл тест или нет. В #ir лежит IR, собранный из текста примера, — его
   run_tests.py сравнивает с target-sample.json побайтово. */
import { YarbpFlavor } from '../../src/js/classes/YarbpFlavor.js';
import { FlexFormsRenderer } from '../../src/js/classes/renderers/FlexFormsRenderer.js';
import { YarbpLexer } from '../../src/js/classes/YarbpLexer.js';
import { YarbpParser } from '../../src/js/classes/YarbpParser.js';
import { flexFormsSuggestions } from '../../src/js/classes/suggestions/flexFormsSuggestions.js';
import { FileManager } from '../../src/js/modules/FileManager.js';
import { YarbpFlexFormsConverter } from '../../src/js/classes/ast-converters/FlexFormsConvertor.js';

/* Разметка берётся из самого редактора — предопределённый пример «Форма ТСД»
   (FileManager, id = builtin-9). Так дым проверяет не копию разметки, а тот
   самый текст, который пользователь видит в папке «Примеры». */
const EXAMPLE_ID = 'builtin-9';
const exampleFile = new FileManager().data.files.find(file => file.id === EXAMPLE_ID);
const MARKUP = exampleFile ? exampleFile.content : '';

const report = [];
const expect = (name, ok, detail) => {
  report.push((ok ? 'OK   ' : 'FAIL ') + name + (ok || !detail ? '' : ' :: ' + detail));
};
const finish = () => {
  const failed = report.filter(line => line.indexOf('FAIL') === 0);
  document.getElementById('result').textContent = report.join('\n');
  document.title = failed.length ? 'SMOKE FAIL' : 'SMOKE PASS';
};


try {
  /* 0. Пример из «Примеров» — тот самый текст, что видит пользователь. */
  expect('пример «Форма ТСД» найден в «Примерах» (' + EXAMPLE_ID + ')', !!exampleFile);

  /* 1. Регистрация флейвора: normalizeFlavorName снимает «-» и пробелы. */
  [['как форма-тсд', 'форматсд'], ['как тсд', 'тсд'],
   ['as flexforms', 'flexforms'], ['как сканер', 'сканер']].forEach(([directive, normalized]) => {
    const flavor = new YarbpFlavor(directive);
    expect('флейвор «' + directive + '» → ' + normalized,
      flavor.flavorName === normalized && !!flavor.flavorData &&
      flavor.flavorData.renderer === FlexFormsRenderer,
      String(flavor.flavorName) + ' / ' + String(flavor.flavorData && flavor.flavorData.renderer));
  });

  /* 2. Разметка → AST → предпросмотр. */
  const lexer = new YarbpLexer();
  lexer.setInitialState(MARKUP);
  lexer.tokenize();

  const parser = new YarbpParser(lexer);
  const textarea = document.getElementById('render-textarea');
  const highlight = document.getElementById('render-highlight-div');
  const renderer = new FlexFormsRenderer(lexer, parser, textarea, highlight, () => {});

  renderer.render();

  /* IR, собранный из текста примера, run_tests.py сравнит с IR образца
     (target-sample.json) побайтово: пример в редакторе — тот же вход, что у
     редизайна, а страница из этого IR уже сверена с редизайном в п.3. */
  document.getElementById('ir').textContent =
    new YarbpFlexFormsConverter(parser.getAST()).toJSON(2);

  await new Promise(resolve => setTimeout(resolve, 1500));

  const container = document.querySelector('#render-pane .ui-render-container');
  expect('контейнер предпросмотра создан', !!container);
  expect('редактор результата скрыт',
    document.querySelector('.editor-container').style.display === 'none',
    document.querySelector('.editor-container').style.display);

  const phone = container && container.querySelector('.ff-phone');
  const svg = container && container.querySelector('.ff-phone-body svg');
  const iframe = container && container.querySelector('.ff-phone-screen iframe');
  const scaleBox = container && container.querySelector('.ff-phone-scale');
  const screenBox = container && container.querySelector('.ff-phone-screen');
  const exportBtn = container && container.querySelector('.ff-export-btn');

  expect('корпус ТСД (SVG getSVG) на месте', !!svg,
    svg ? svg.getAttribute('viewBox') : 'нет');
  expect('рамка отмасштабирована под панель',
    !!scaleBox && scaleBox.clientWidth > 100 && scaleBox.clientHeight > 200,
    scaleBox ? scaleBox.clientWidth + 'x' + scaleBox.clientHeight : 'нет');
  /* Экран — нарисованное место в рамке (между шапкой 1С-клиента и клавиатурой),
     а сам iframe — фиксированный логический размер: форма верстается один раз
     и масштабируется трансформацией, а не перекомпоновывается под панель. */
  expect('экран в рамке 338x447 (место на рисунке)',
    !!screenBox && screenBox.offsetWidth === 338 && screenBox.offsetHeight === 447,
    screenBox ? screenBox.offsetWidth + 'x' + screenBox.offsetHeight : 'нет');
  expect('углы экрана не скруглены',
    !!screenBox && screenBox.offsetWidth > 0 &&
    getComputedStyle(screenBox).borderTopLeftRadius === '0px',
    screenBox ? getComputedStyle(screenBox).borderTopLeftRadius : 'нет');
  expect('iframe верстается в 356x471 (логический размер формы)',
    !!iframe && iframe.offsetWidth === 356 && iframe.offsetHeight === 471,
    iframe ? iframe.offsetWidth + 'x' + iframe.offsetHeight : 'нет');
  expect('iframe вписан в экран (уменьшен, а не обрезан)',
    !!iframe && !!screenBox &&
    Math.abs(iframe.getBoundingClientRect().width - screenBox.getBoundingClientRect().width) <= 1 &&
    Math.abs(iframe.getBoundingClientRect().height - screenBox.getBoundingClientRect().height) <= 1,
    iframe && screenBox ? iframe.getBoundingClientRect().width.toFixed(1) + ' / ' +
      screenBox.getBoundingClientRect().width.toFixed(1) : 'нет');
  expect('рамка масштабируется трансформацией (без пересборки размеров)',
    !!phone && /^scale\(/.test(phone.style.transform || '') &&
    phone.style.width === '346px' && phone.style.height === '758px',
    phone ? phone.style.transform + ' / ' + phone.style.width + 'x' + phone.style.height : 'нет');
  /* Иконка скачивания — SVG 800x800: без ограничения кнопка растягивалась на
     всю панель и накрывала макет. */
  expect('кнопка скачивания не растягивается на панель',
    !!exportBtn && exportBtn.offsetWidth > 0 && exportBtn.offsetWidth < 60 &&
    exportBtn.offsetHeight < 60,
    exportBtn ? exportBtn.offsetWidth + 'x' + exportBtn.offsetHeight : 'нет');

  const srcdoc = iframe ? iframe.srcdoc : '';
  expect('iframe получил страницу формы', srcdoc.length > 100000, String(srcdoc.length));
  expect('в странице IR из разметки',
    srcdoc.indexOf('"заголовокФормы": "Отправка данных в 1С"') !== -1);
  expect('в странице обе операции',
    srcdoc.indexOf('"Подобрать товар"') !== -1 && srcdoc.indexOf('"Отправить"') !== -1);
  expect('в странице скрипт предпросмотра',
    srcdoc.indexOf("localStorage.getItem('tsd-form-state')") !== -1);

  /* 3. Движок внутри iframe отрисовал форму (если origin доступен). */
  let innerDoc = null;
  try { innerDoc = iframe && iframe.contentDocument; } catch (e) { innerDoc = null; }
  if (innerDoc) {
    const track = innerDoc.getElementById('track');
    const select = innerDoc.getElementById('action-input');
    const brand = innerDoc.getElementById('brandText');
    expect('движок: экраны операций отрисованы', !!track && track.children.length === 2,
      track ? String(track.children.length) : 'нет #track');
    expect('движок: выбор операции заполнен', !!select && select.options.length === 2,
      select ? String(select.options.length) : 'нет #action-input');
    expect('движок: заголовок формы в шапке',
      !!brand && brand.textContent === 'Отправка данных в 1С',
      brand ? brand.textContent : 'нет #brandText');
  } else {
    report.push('INFO нет доступа к iframe.contentDocument (file:// origin)');
  }

  expect('подсказки: виды полей на месте',
    flexFormsSuggestions.nodes['группа'].variants.some(v => v.label === 'поле:штрихкод'));

  /* 4. Дебаунс и пропуск по неизменившемуся IR: печать в разметке не должна
     перезагружать iframe на каждое нажатие. */
  let mounts = 0;
  const mount = renderer.mountPreview.bind(renderer);
  renderer.mountPreview = (IR, serialized) => { mounts++; return mount(IR, serialized); };

  renderer.render();                       // тот же AST → IR тот же
  await new Promise(resolve => setTimeout(resolve, 700));
  expect('повторный render с тем же IR не перезагружает iframe', mounts === 0,
    'перезагрузок: ' + mounts);

  renderer.lastIR = 'stale';               // имитируем изменённую разметку
  renderer.render();
  expect('изменённый IR ждёт паузы в наборе (дебаунс)', mounts === 0,
    'перезагрузок сразу: ' + mounts);

  await new Promise(resolve => setTimeout(resolve, 900));
  expect('после паузы предпросмотр перерисован один раз', mounts === 1,
    'перезагрузок: ' + mounts);
} catch (error) {
  report.push('FAIL исключение: ' + (error && error.message ? error.message : error));
}

finish();
</script>
</body>
</html>
