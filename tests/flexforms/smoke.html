<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>flexforms smoke</title>
<style>
  html,body{margin:0;padding:0;background:#111;color:#ddd;font:13px/1.4 monospace}
  #render-pane{position:fixed;right:0;top:0;width:460px;height:720px;border-left:1px solid #333}
  #result{padding:8px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="render-pane">
  <div class="editor-container">
    <div id="render-highlight-div" class="highlight-layer"></div>
    <textarea id="render-textarea" class="code-input"></textarea>
  </div>
</div>
<pre id="result">pending</pre>
<pre id="ir" hidden></pre>

<script type="module">
/* Дымовой тест флейвора «форма-ТСД»: реальные модули редактора, разметка —
   предопределённый пример «Форма ТСД» из «Примеров», настоящий рендерер.
   Результат печатается в #result, по нему и по <title> run_tests.py понимает,
   прошёл тест или нет. В #ir лежит IR, собранный из текста примера, — его
   run_tests.py сравнивает с builtin-ir.json побайтово. */
import { YarbpFlavor } from '../../src/js/classes/YarbpFlavor.js';
import { FlexFormsRenderer } from '../../src/js/classes/renderers/FlexFormsRenderer.js';
import { buildFormPage } from '../../src/js/classes/renderers/flexforms/FlexFormsPage.js';
import { YarbpLexer } from '../../src/js/classes/YarbpLexer.js';
import { YarbpParser } from '../../src/js/classes/YarbpParser.js';
import { flexFormsSuggestions } from '../../src/js/classes/suggestions/flexFormsSuggestions.js';
import { FileManager } from '../../src/js/modules/FileManager.js';
import { YarbpFlexFormsConverter } from '../../src/js/classes/ast-converters/FlexFormsConvertor.js';

/* Разметка берётся из самого редактора — предопределённый пример «Форма ТСД»
   (FileManager, id = builtin-9). Так дым проверяет не копию разметки, а тот
   самый текст, который пользователь видит в папке «Примеры». */
const EXAMPLE_ID = 'builtin-9';
const exampleFile = new FileManager().data.files.find(file => file.id === EXAMPLE_ID);
const MARKUP = exampleFile ? exampleFile.content : '';

const report = [];
const expect = (name, ok, detail) => {
  report.push((ok ? 'OK   ' : 'FAIL ') + name + (ok || !detail ? '' : ' :: ' + detail));
};
const finish = () => {
  const failed = report.filter(line => line.indexOf('FAIL') === 0);
  document.getElementById('result').textContent = report.join('\n');
  document.title = failed.length ? 'SMOKE FAIL' : 'SMOKE PASS';
};

/* Выбранная в предпросмотре тема — чтобы после перерисовки iframe сверить её. */
let themeChosen = null;


try {
  /* 0. Пример из «Примеров» — тот самый текст, что видит пользователь. */
  expect('пример «Форма ТСД» найден в «Примерах» (' + EXAMPLE_ID + ')', !!exampleFile);

  /* 1. Регистрация флейвора: normalizeFlavorName снимает «-» и пробелы. */
  [['как форма-тсд', 'форматсд'], ['как тсд', 'тсд'],
   ['as flexforms', 'flexforms'], ['как сканер', 'сканер']].forEach(([directive, normalized]) => {
    const flavor = new YarbpFlavor(directive);
    expect('флейвор «' + directive + '» → ' + normalized,
      flavor.flavorName === normalized && !!flavor.flavorData &&
      flavor.flavorData.renderer === FlexFormsRenderer,
      String(flavor.flavorName) + ' / ' + String(flavor.flavorData && flavor.flavorData.renderer));
  });

  /* 2. Разметка → AST → предпросмотр. */
  const lexer = new YarbpLexer();
  lexer.setInitialState(MARKUP);
  lexer.tokenize();

  const parser = new YarbpParser(lexer);
  const textarea = document.getElementById('render-textarea');
  const highlight = document.getElementById('render-highlight-div');
  const renderer = new FlexFormsRenderer(lexer, parser, textarea, highlight, () => {});

  renderer.render();

  /* IR, собранный из текста примера, run_tests.py сравнит с builtin-ir.json
     побайтово: пример в редакторе проверяется как единый вход, а страница из
     этого IR уже сверена с редизайном в п.3. */
  const irText = new YarbpFlexFormsConverter(parser.getAST()).toJSON(2);
  document.getElementById('ir').textContent = irText;
  const irConfig = JSON.parse(irText);
  const irNodes = [];
  const collectIrNodes = node => {
    if (!node || typeof node !== 'object') return;
    if (Array.isArray(node)) { node.forEach(collectIrNodes); return; }
    if (node.type) irNodes.push(node);
    if (Array.isArray(node.children)) node.children.forEach(collectIrNodes);
  };
  collectIrNodes(irConfig);
  const irTable = irNodes.find(node => node.type === 'таблица');
  const irBarcode = irNodes.find(node => node.тип === 'Штрихкод');
  expect('IR: таблица собрана из колонок',
    !!irTable && irTable.шапка.length === 3 &&
    irTable.измерения.join('|') === 'Товар|Характеристика' &&
    irTable.ресурсы.join('|') === 'Кол‑во',
    irTable ? JSON.stringify({ шапка: irTable.шапка, измерения: irTable.измерения, ресурсы: irTable.ресурсы }) : 'нет таблицы');
  expect('IR: настройки штрихкода заполнены по умолчанию',
    !!irBarcode &&
    irBarcode.значенияПриемниковПоУмолчанию.join('|') === '||1' &&
    irBarcode.кнопкаОчистки === 'да' && irBarcode.автофокус === 'да' &&
    irBarcode.режимСканирования === 'суммироватьДоПереноса',
    irBarcode ? JSON.stringify({
      значения: irBarcode.значенияПриемниковПоУмолчанию,
      кнопкаОчистки: irBarcode.кнопкаОчистки,
      автофокус: irBarcode.автофокус,
      режимСканирования: irBarcode.режимСканирования,
    }) : 'нет штрихкода');
  const irActions = irConfig.children.filter(child => child.type === 'операция');
  expect('IR: «перезагрузить» по умолчанию не пишется',
    irActions.length === 2 && irActions.every(action => !('перезагрузить' in action)),
    irActions.map(action => action.имя + '=' + String(action.перезагрузить)).join(', '));
  expect('IR: табло статистики включено по умолчанию (true)',
    irActions.length === 2 && irActions.every(action => action.отображатьСтатистику === true),
    irActions.map(action => action.имя + '=' + String(action.отображатьСтатистику)).join(', '));

  await new Promise(resolve => setTimeout(resolve, 1500));

  const container = document.querySelector('#render-pane .ui-render-container');
  expect('контейнер предпросмотра создан', !!container);
  expect('редактор результата скрыт',
    document.querySelector('.editor-container').style.display === 'none',
    document.querySelector('.editor-container').style.display);

  const phone = container && container.querySelector('.ff-phone');
  const svg = container && container.querySelector('.ff-phone-body svg');
  const iframe = container && container.querySelector('.ff-phone-screen iframe');
  const scaleBox = container && container.querySelector('.ff-phone-scale');
  const screenBox = container && container.querySelector('.ff-phone-screen');
  const exportButtons = container ? container.querySelectorAll('.ff-export-btn') : [];
  const configBtn = container && container.querySelector('.ff-export-btn--config');
  const htmlBtn = container && container.querySelector('.ff-export-btn--html');
  const mockBtn = container && container.querySelector('.ff-export-btn--mock');

  expect('корпус ТСД (SVG getSVG) на месте', !!svg,
    svg ? svg.getAttribute('viewBox') : 'нет');
  expect('рамка отмасштабирована под панель',
    !!scaleBox && scaleBox.clientWidth > 100 && scaleBox.clientHeight > 200,
    scaleBox ? scaleBox.clientWidth + 'x' + scaleBox.clientHeight : 'нет');
  /* Экран — нарисованное место в рамке (между шапкой 1С-клиента и клавиатурой),
     и он же ровно логический размер страницы: форма показывается 1:1, без
     собственного масштаба iframe (иначе текст и 1px-рамки полей мылились, а
     всё содержимое выглядело мельче редизайна). */
  expect('экран в рамке 356x471 (равен логическому размеру формы)',
    !!screenBox && screenBox.offsetWidth === 356 && screenBox.offsetHeight === 471,
    screenBox ? screenBox.offsetWidth + 'x' + screenBox.offsetHeight : 'нет');
  expect('углы экрана не скруглены',
    !!screenBox && screenBox.offsetWidth > 0 &&
    getComputedStyle(screenBox).borderTopLeftRadius === '0px',
    screenBox ? getComputedStyle(screenBox).borderTopLeftRadius : 'нет');
  expect('iframe верстается в 356x471 (логический размер формы)',
    !!iframe && iframe.offsetWidth === 356 && iframe.offsetHeight === 471,
    iframe ? iframe.offsetWidth + 'x' + iframe.offsetHeight : 'нет');
  expect('iframe не масштабируется и точно совпадает с экраном (1:1)',
    !!iframe && !!screenBox &&
    getComputedStyle(iframe).transform === 'none' &&
    Math.abs(iframe.getBoundingClientRect().width - screenBox.getBoundingClientRect().width) <= 0.5 &&
    Math.abs(iframe.getBoundingClientRect().height - screenBox.getBoundingClientRect().height) <= 0.5,
    iframe && screenBox ? getComputedStyle(iframe).transform + ', ' +
      iframe.getBoundingClientRect().width.toFixed(1) + ' / ' +
      screenBox.getBoundingClientRect().width.toFixed(1) : 'нет');
  expect('рамка масштабируется трансформацией (без пересборки размеров)',
    !!phone && /^scale\(/.test(phone.style.transform || '') &&
    phone.style.width === '364px' && phone.style.height === '799px',
    phone ? phone.style.transform + ' / ' + phone.style.width + 'x' + phone.style.height : 'нет');
  /* Панель 460x720 (см. #render-pane вверху) выше экрана, поэтому масштаб должен
     остаться 1: форма в предпросмотре ровно того же размера, что в редизайне.
     Раньше рамка росла до 1.6, а в маленькой панели ужималась по корпусу — из-за
     этого «в рендере всё на 15% мельче». Сравниваем числом: CSSOM нормализует
     scale(1.0000) обратно в scale(1). */
  const phoneScale = phone ? parseFloat((phone.style.transform || '').replace(/[^\d.]/g, '')) : 0;
  expect('в панели 460x720 масштаб 1:1 (форма 356 точек, как в редизайне)',
    Math.abs(phoneScale - 1) < 0.0005 && !!iframe &&
    Math.abs(iframe.getBoundingClientRect().width - 356) <= 0.5,
    phone ? phone.style.transform + ', форма ' +
      (iframe ? iframe.getBoundingClientRect().width.toFixed(1) : 'нет') : 'нет');
  /* Три выгрузки: JSON-конфиг, HTML-страница и Python-мок сервера. Подписи
     текстовые, без иконок: одинаковые download-*.svg ничего не объясняли. */
  expect('кнопки выгрузки: JSON, HTML и мок-сервер',
    exportButtons.length === 3 && !!configBtn && !!htmlBtn && !!mockBtn &&
    configBtn.textContent.trim() === 'JSON' &&
    htmlBtn.textContent.trim() === 'HTML' &&
    mockBtn.textContent.trim() === 'мок-сервер' &&
    !configBtn.querySelector('img') && !htmlBtn.querySelector('img') &&
    !mockBtn.querySelector('img'),
    exportButtons.length + ' кнопок, текст=' +
      (configBtn ? configBtn.textContent.trim() : 'нет') + ' / ' +
      (htmlBtn ? htmlBtn.textContent.trim() : 'нет') + ' / ' +
      (mockBtn ? mockBtn.textContent.trim() : 'нет'));
  expect('кнопки выгрузки не растягиваются на панель',
    !!configBtn && !!htmlBtn && !!mockBtn &&
    configBtn.offsetWidth > 0 && configBtn.offsetWidth < 70 &&
    configBtn.offsetHeight < 60 &&
    htmlBtn.offsetWidth > 0 && htmlBtn.offsetWidth < 70 &&
    htmlBtn.offsetHeight < 60 &&
    mockBtn.offsetWidth > 0 && mockBtn.offsetWidth < 70 &&
    mockBtn.offsetHeight < 60,
    (configBtn ? configBtn.offsetWidth + 'x' + configBtn.offsetHeight : 'нет') +
      ' / ' + (htmlBtn ? htmlBtn.offsetWidth + 'x' + htmlBtn.offsetHeight : 'нет') +
      ' / ' + (mockBtn ? mockBtn.offsetWidth + 'x' + mockBtn.offsetHeight : 'нет'));

  // Страница формы уходит в iframe через страницу-хост (src/preview.html) —
  // иначе её встроенные скрипты блокировала бы строгая CSP редактора. Поэтому
  // проверяем ровно тот документ, который рендерер отдал хосту.
  const srcdoc = renderer && typeof renderer.pendingPreviewHtml === 'string'
    ? renderer.pendingPreviewHtml
    : (iframe ? iframe.srcdoc : '');
  expect('iframe получил страницу формы', srcdoc.length > 100000, String(srcdoc.length));
  expect('в странице IR из разметки',
    srcdoc.indexOf('"заголовокФормы": "Отправка данных в 1С"') !== -1);
  expect('в странице обе операции',
    srcdoc.indexOf('"Подобрать товар"') !== -1 &&
    srcdoc.indexOf('"Отправить результат"') !== -1);
  expect('в странице адрес сервиса из шапки',
    srcdoc.indexOf('"сервис": "http://127.0.0.1:8765/rt_m_bot/hs/dp"') !== -1);
  expect('в странице относительные хук и урл',
    srcdoc.indexOf('"хук": "/link"') !== -1 &&
    srcdoc.indexOf('"урл": "/processing"') !== -1);
  expect('в странице скрипт предпросмотра',
    srcdoc.indexOf("localStorage.getItem('tsd-form-state')") !== -1);

  /* 3. Движок внутри iframe отрисовал форму (если origin доступен). */
  let innerDoc = null;
  try { innerDoc = iframe && iframe.contentDocument; } catch (e) { innerDoc = null; }
  if (innerDoc) {
    const track = innerDoc.getElementById('track');
    const select = innerDoc.getElementById('action-input');
    const brand = innerDoc.getElementById('brandText');
    expect('движок: экраны операций отрисованы', !!track && track.children.length === 2,
      track ? String(track.children.length) : 'нет #track');
    expect('движок: выбор операции заполнен', !!select && select.options.length === 2,
      select ? String(select.options.length) : 'нет #action-input');
    const innerTable = innerDoc.querySelector('table.ff-table');
    expect('движок: таблица-приёмник отрисована',
      !!innerTable && innerTable.id === 'a2_t1' &&
      innerTable.classList.contains('is-empty'),
      innerTable ? innerTable.id + ' / ' + innerTable.className : 'нет table.ff-table');
    const innerWin = innerDoc.defaultView;
    /* 3а. Плашки групп и блок таблицы.
       Подложка (.card.grid-card) ставится на КАЖДУЮ группу операции («поля» в
       IR), а не одна на экран. Сверяем число групп в IR с числом плашек в DOM. */
    const innerRows = id => {
      const table = innerDoc.getElementById(id);
      return table ? table.querySelectorAll('tbody tr').length : -1;
    };
    const rowsInIr = id => {
      const ir = innerWin.readParams();
      let count = -1;
      (ir.children || []).forEach(op => (op.children || []).forEach(grid =>
        (grid.children || []).forEach(el => {
          if (el['ид'] === id && el.type === 'таблица') count = (el.children || []).length;
        })));
      return count;
    };
    const groupsInIr = opId => {
      const ir = innerWin.readParams();
      const action = (ir.children || []).find(node => node['ид'] === opId);
      return action ? (action.children || []).length : -1;
    };
    const cardsIn = index => {
      const screen = track.children[index];
      return screen ? screen.querySelectorAll(':scope > .card.grid-card').length : -1;
    };
    expect('группы: своя плашка-карточка на каждую группу операции',
      cardsIn(0) === groupsInIr('a1') && cardsIn(1) === groupsInIr('a2') &&
      cardsIn(0) > 0 && cardsIn(1) > 0,
      'a1: ' + cardsIn(0) + '/' + groupsInIr('a1') +
        ', a2: ' + cardsIn(1) + '/' + groupsInIr('a2'));

    /* Пустая таблица-приёмник: шапка блока (имя + счётчик строк) и подсказка
       про сканер. a2_t1 — приёмник операции a1 (.приемник a2_t1). */
    const a2Screen = track.children[1];
    const a2Head = a2Screen ? a2Screen.querySelector('.tbl-head') : null;
    const a2Empty = a2Screen ? a2Screen.querySelector('.empty') : null;
    expect('таблица: шапка блока — имя и счётчик строк',
      !!a2Head && /Товары в заказе/.test(a2Head.textContent) &&
      !!a2Head.querySelector('.tbl-count') &&
      a2Head.querySelector('.tbl-count').textContent === '0',
      a2Head ? a2Head.textContent.replace(/\s+/g, ' ').trim() : 'нет .tbl-head');
    expect('таблица-приёмник: подсказка «Отсканируйте товар» на месте',
      !!a2Empty && a2Empty.textContent.indexOf('Отсканируйте товар') !== -1,
      a2Empty ? a2Empty.textContent.trim() : 'нет .empty');

    /* Редактируемая таблица (a2_t1: .редактируемая да) — кнопка добавления
       строки. Строка обязана попасть в IR: отправка берёт строки оттуда. */
    const a2Add = a2Screen ? a2Screen.querySelector('.row-add') : null;
    expect('редактируемая таблица: кнопка «Добавить строку» есть',
      !!a2Add && a2Add.dataset.tableId === 'a2_t1' &&
      a2Add.textContent.indexOf('Добавить строку') !== -1,
      a2Add ? a2Add.dataset.tableId + ' / ' + a2Add.textContent.trim() : 'нет .row-add');
    if (a2Add) a2Add.click();
    expect('редактируемая таблица: строка добавлена в DOM и в IR',
      innerRows('a2_t1') === 1 && rowsInIr('a2_t1') === 1,
      'DOM=' + innerRows('a2_t1') + ', IR=' + rowsInIr('a2_t1'));
    expect('редактируемая таблица: подсказка ушла, счётчик стал 1',
      !a2Screen.querySelector('.empty') && !!a2Head &&
      a2Head.querySelector('.tbl-count').textContent === '1',
      a2Head ? 'счётчик=' + a2Head.querySelector('.tbl-count').textContent : 'нет .tbl-head');

    /* Правка ячейки: contenteditable больше не живёт «сама по себе» — значение
       уезжает в IR (syncTableCell), иначе оно терялось при отправке. */
    const firstCell = innerDoc.querySelector('#a2_t1 tbody tr td');
    if (firstCell) {
      firstCell.textContent = 'Хлеб';
      firstCell.dispatchEvent(new innerWin.Event('input', { bubbles: true }));
    }
    const cellInIr = (() => {
      const ir = innerWin.readParams();
      let value = null;
      (ir.children || []).forEach(op => (op.children || []).forEach(grid =>
        (grid.children || []).forEach(el => {
          if (el['ид'] === 'a2_t1' && el.children && el.children[0]) {
            value = el.children[0].cells[0].value;
          }
        })));
      return value;
    })();
    expect('редактируемая таблица: правка ячейки уходит в IR',
      cellInIr === 'Хлеб', String(cellInIr));

    /* Возвращаем таблицу приёмника в исходное состояние: следующие проверки
       (табло, отправка) рассчитывают на пустой приёмник. */
    const cleanIr = innerWin.readParams();
    (cleanIr.children || []).forEach(op => (op.children || []).forEach(grid =>
      (grid.children || []).forEach(el => {
        if (el['ид'] === 'a2_t1' && el.type === 'таблица') el.children = [];
      })));
    innerWin.writeParams(cleanIr);
    innerWin.refreshReceiverView();
    expect('редактируемая таблица: после очистки подсказка вернулась',
      innerRows('a2_t1') === 0 && !!a2Screen.querySelector('.empty') &&
      rowsInIr('a2_t1') === 0,
      'строк=' + innerRows('a2_t1') + ', IR=' + rowsInIr('a2_t1'));

    expect('движок: заголовок формы в шапке',
      !!brand && brand.textContent === 'Отправка данных в 1С',
      brand ? brand.textContent : 'нет #brandText');
    const server = innerDoc.getElementById('brandServer');
    expect('движок: адрес сервера выведен в шапку',
      !!server && server.textContent.indexOf('http://127.0.0.1:8765/rt_m_bot/hs/dp') !== -1,
      server ? server.textContent : 'нет #brandServer');

    /* 3a. Режим «клавиатура выключена» (scan — по умолчанию): поле readOnly и
       inputmode=none, то есть ОС не поднимает экранную клавиатуру. Ввод при
       этом не теряется: мост сканера (initScannerBridge) набирает символы
       клавиатурного клина в readonly-поле и по Enter шлёт 'change' — ровно то,
       что делает сканер на ТСД. */
    const serviceBase = 'http://127.0.0.1:8765/rt_m_bot/hs/dp';
    expect('адрес: относительный хук склеен с сервисом из шапки',
      typeof innerWin.resolveFormUrl === 'function' &&
      innerWin.resolveFormUrl('/link', serviceBase) === serviceBase + '/link',
      typeof innerWin.resolveFormUrl === 'function'
        ? innerWin.resolveFormUrl('/link', serviceBase) : 'нет resolveFormUrl');
    expect('адрес: относительный урл склеен с сервисом из шапки',
      typeof innerWin.resolveFormUrl === 'function' &&
      innerWin.resolveFormUrl('/processing', serviceBase) === serviceBase + '/processing',
      typeof innerWin.resolveFormUrl === 'function'
        ? innerWin.resolveFormUrl('/processing', serviceBase) : 'нет resolveFormUrl');
    expect('адрес: полный URL не переписывается',
      typeof innerWin.resolveFormUrl === 'function' &&
      innerWin.resolveFormUrl('https://other.example/processing', serviceBase) ===
        'https://other.example/processing',
      typeof innerWin.resolveFormUrl === 'function'
        ? innerWin.resolveFormUrl('https://other.example/processing', serviceBase) : 'нет resolveFormUrl');

    /* 3d. Автофокус — правка рендера, не редизайна. Движок после каждой
       отрисовки зовёт setFocus() и ставит курсор в поле с маркером
       .autofocus-mark (а без него — в выбор операции #action-input). На ТСД это
       нужно сканеру, а в редакторе фокус уходит из окна кода на каждой
       перерисовке, поэтому в предпросмотре setFocus() — пустышка. Маркер в
       разметке при этом остаётся: меняется только вызов. */
    const autofocusField = innerDoc.querySelector('.autofocus-mark');
    expect('автофокус: маркер .autofocus-mark в разметке на месте',
      !!autofocusField,
      autofocusField ? (autofocusField.id || autofocusField.className) : 'нет .autofocus-mark');

    /* setFocus() срабатывает через setTimeout(300) — ждём, чтобы фокус успел
       бы «уехать», если заглушка не доехала в собранную страницу. */
    await new Promise(resolve => setTimeout(resolve, 600));
    const focusedEl = innerDoc.activeElement;
    expect('автофокус: предпросмотр не забирает фокус у редактора',
      !!autofocusField && focusedEl !== autofocusField &&
      focusedEl !== innerDoc.getElementById('action-input'),
      focusedEl ? focusedEl.tagName + (focusedEl.className ? '.' + focusedEl.className : '') : 'null');

    /* Контроль обратной стороны: в странице без предпросмотра (её собирает
       расширение 1С) правки нет, и движок фокус ставит — иначе проверка выше
       ничего не доказывает: она бы проходила и на сломанном движке. Страница
       самодостаточна (один HTML без сети), поэтому грузим её в srcdoc. */
    const controlFrame = document.createElement('iframe');
    controlFrame.style.cssText = 'position:fixed;left:-9999px;top:0;width:356px;height:471px;border:0';
    controlFrame.srcdoc = buildFormPage(document.getElementById('ir').textContent);
    document.body.appendChild(controlFrame);
    let controlDoc = null;
    let controlWin = null;
    for (let attempt = 0; attempt < 40; attempt++) {
      await new Promise(resolve => setTimeout(resolve, 100));
      try { controlDoc = controlFrame.contentDocument; } catch (e) { controlDoc = null; }
      controlWin = controlDoc && controlDoc.defaultView;
      if (controlWin && controlDoc.querySelector('.autofocus-mark') &&
          typeof controlWin.setFocus === 'function') break;
    }
    const controlField = controlDoc && controlDoc.querySelector('.autofocus-mark');
    expect('автофокус: в странице для ТСД setFocus живой (правка только в предпросмотре)',
      !!controlWin && /setTimeout/.test(String(controlWin.setFocus)),
      controlWin ? String(controlWin.setFocus).slice(0, 60) : 'нет окна');
    await new Promise(resolve => setTimeout(resolve, 600));
    expect('автофокус: в странице для ТСД движок ставит фокус (контроль проверки выше)',
      !!controlField && controlDoc.activeElement === controlField,
      controlDoc ? String(controlDoc.activeElement && controlDoc.activeElement.className) : 'нет документа');
    controlFrame.remove();

    const kbBtn = innerDoc.getElementById('kbBtn');
    let qtyInput = innerDoc.querySelector('.qty-input-wrap input');
    if (qtyInput && !qtyInput.readOnly && kbBtn) {   // остался режим 'type' прошлого запуска
      kbBtn.click();
      qtyInput = innerDoc.querySelector('.qty-input-wrap input');
    }
    expect('сканер: без клавиатуры поле readOnly + inputmode=none',
      !!qtyInput && qtyInput.readOnly === true &&
      qtyInput.getAttribute('inputmode') === 'none',
      qtyInput ? 'readOnly=' + qtyInput.readOnly + ', inputmode=' +
        qtyInput.getAttribute('inputmode') : 'нет .qty-input-wrap input');

    /* Типовой спиннер number-поля — стиль самого браузера, поэтому снимается
       только appearance:none (иначе всплывает по наведению поверх каунтера).
       Мало снять appearance у контрола: стрелки — это псевдоэлементы движка
       (::-webkit-inner/outer-spin-button), у них свои правила, поэтому
       проверяем оба уровня и на всех числовых полях страницы (.qty-input-wrap
       и numeric-поле в .control). */
    const qtyStyle = qtyInput ? innerWin.getComputedStyle(qtyInput) : null;
    expect('каунтер: типовой спиннер number-поля снят (appearance:none)',
      !!qtyStyle && qtyStyle.appearance === 'none',
      qtyStyle ? String(qtyStyle.appearance) : 'нет поля');

    const numericInputs = Array.prototype.slice.call(
      innerDoc.querySelectorAll('input[type="number"]'));
    /* У псевдоэлементов спиннера проверяем appearance, а не display:
       в Chromium display:none на них не применяется (computed остаётся
       inline-block), стрелки убирает только appearance:none — проверено
       пробой, поэтому проверка завязана на то, что реально работает. */
    const spinnersLeft = numericInputs.filter(input => {
      const own = innerWin.getComputedStyle(input).appearance;
      const innerSpin = innerWin.getComputedStyle(input, '::-webkit-inner-spin-button');
      const outerSpin = innerWin.getComputedStyle(input, '::-webkit-outer-spin-button');
      return own !== 'none' ||
        innerSpin.appearance !== 'none' || outerSpin.appearance !== 'none';
    });
    expect('каунтер: стрелки спиннера скрыты у всех number-полей',
      numericInputs.length > 0 && spinnersLeft.length === 0,
      'number-полей ' + numericInputs.length + ', со стрелками ' + spinnersLeft.length);

    if (qtyInput) {
      qtyInput.value = '';
      innerWin.focus();
      qtyInput.focus();
      if (innerDoc.activeElement === qtyInput) {
        '48120'.split('').forEach(symbol =>
          innerDoc.dispatchEvent(new innerWin.KeyboardEvent('keydown', { key: symbol, bubbles: true })));
        expect('сканер: мост набирает символы в readonly-поле',
          qtyInput.value === '48120', JSON.stringify(qtyInput.value));
      } else {
        report.push('INFO мост сканера: фокус в iframe недоступен из автотеста');
      }
    }

    /* 3b. Свайп и анимация перехода — код страницы (initSwipe → goTo), в
       редакторе ничего дублировать не нужно: трек едет трансформацией. */
    const pager = innerDoc.getElementById('pager');
    const trackEl = innerDoc.getElementById('track');
    const stepNow = innerDoc.getElementById('stepNow');
    if (pager && trackEl && stepNow) {
      const touch = (type, x) => {
        const event = new innerWin.Event(type, { bubbles: true });
        Object.defineProperty(event, type === 'touchend' ? 'changedTouches' : 'touches',
          { value: [{ clientX: x, clientY: 200 }] });
        pager.dispatchEvent(event);
      };
      touch('touchstart', 260);
      touch('touchend', 140);            // dx = -120 → следующий экран
      expect('свайп влево листает экран и двигает трек',
        trackEl.style.transform === 'translateX(-100%)' && stepNow.textContent === '2',
        'transform=' + trackEl.style.transform + ', шаг=' + stepNow.textContent);
    } else {
      report.push('FAIL свайп: нет #pager/#track/#stepNow');
    }

    /* 3c. Тема: кнопка пишет выбор в localStorage, отдельно от снимка полей. */
    const themeBtn = innerDoc.getElementById('themeBtn');
    const themeBefore = innerDoc.documentElement.getAttribute('data-theme');
    if (themeBtn) {
      themeBtn.click();
      themeChosen = innerDoc.documentElement.getAttribute('data-theme');
      const themeSaved = innerWin.localStorage.getItem('tsd-theme');
      expect('тема: кнопка переключает и запоминает выбор',
        themeChosen !== themeBefore && themeSaved === themeChosen,
        themeBefore + ' → ' + themeChosen + ', localStorage=' + themeSaved);
    }

    /* 3g. Действие с .урл после успешной отправки сбрасывает данные целиком.
       Табло «Позиций / Кол-во / Статус» должно пересчитаться из ОЧИЩЕННОГО IR:
       раньше сводка восстанавливалась из старого state.params и оставалась с
       цифрами отправленной партии. */
    const summaryOf = () => {
      const box = innerDoc.querySelectorAll('.screen')[1];
      const summary = box ? box.querySelector('.summary') : null;
      if (!summary) return '';
      return Array.prototype.map.call(summary.querySelectorAll('b'),
        item => item.textContent).join('|');
    };
    const rowsOf = id => {
      const table = innerDoc.getElementById(id);
      return table ? table.querySelectorAll('tbody tr').length : -1;
    };

    /* Табло показывается у действия с внешним приёмником (.урл). */
    expect('табло: у действия с .урл есть сводка', summaryOf() !== '',
      summaryOf() || 'нет .summary');

    /* Кладём строку в приёмник и жмём кнопку действия — как оператор. */
    const irNow = innerWin.readParams();
    let a2Table = null;
    irNow.children.filter(child => child.ид === 'a2').forEach(op =>
      (op.children || []).forEach(grid => (grid.children || []).forEach(el => {
        if (el.type === 'таблица') { a2Table = el; }
      })));
    if (a2Table) {
      a2Table.children.push({
        ид: 'a2_t1-smoke',
        type: 'строка',
        cells: [{ 'value': 'Товар А' }, { 'value': '' }, { 'value': '3' }]
      });
      innerWin.writeParams(irNow);
      innerWin.refreshReceiverView();
    }
    expect('табло: строка приёмника попала в сводку',
      rowsOf('a2_t1') === 1 && summaryOf().indexOf('1') === 0,
      'строк=' + rowsOf('a2_t1') + ', сводка=' + summaryOf());

    innerWin.fetch = () => Promise.resolve({
      ok: true,
      json: () => Promise.resolve({ 'result': 'ok' })
    });
    /* Остатки прошлых проверок (мост сканера оставил «48120» в поле Кол-во)
       убираем: иначе отправка спросит confirm'ом про незанесённые данные
       источника, а диалог в headless подвешивает страницу. */
    Array.prototype.forEach.call(innerDoc.querySelectorAll('input'), input => {
      input.value = '';
      input.dataset.uid = '';
    });
    innerWin.confirm = () => false;
    const sendBtn = innerDoc.getElementById('a2');
    if (sendBtn) { sendBtn.click(); }
    await new Promise(resolve => setTimeout(resolve, 600));

    expect('отправка: таблица очищена после успеха', rowsOf('a2_t1') === 0,
      'строк=' + rowsOf('a2_t1'));
    expect('отправка: табло сброшено после успеха', summaryOf().indexOf('0') === 0,
      'сводка=' + summaryOf());
    expect('отправка: форма вернулась на первый экран',
      innerDoc.getElementById('stepNow').textContent === '1' &&
      innerDoc.getElementById('action-input').value === 'a1',
      'шаг=' + innerDoc.getElementById('stepNow').textContent +
      ', операция=' + innerDoc.getElementById('action-input').value);
    expect('отправка: снимок localStorage стёрт',
      innerWin.localStorage.getItem('tsd-form-state') === null,
      String(innerWin.localStorage.getItem('tsd-form-state')).slice(0, 40));

    /* 3h. Служебные кнопки — обычной строкой в потоке: position static, а
       прокручивается каркас (.app), поэтому при нехватке места строка уезжает
       вниз, а не отбирает высоту у формы. */
    const toolsRow = innerDoc.querySelector('.tools-row');
    const appBox = innerDoc.querySelector('.app');
    const toolsStyle = toolsRow ? innerWin.getComputedStyle(toolsRow) : null;
    const appStyle = appBox ? innerWin.getComputedStyle(appBox) : null;
    expect('служебные кнопки: position static (не fixed/sticky)',
      !!toolsStyle && toolsStyle.position === 'static',
      toolsStyle ? toolsStyle.position : 'нет .tools-row');
    expect('служебные кнопки: прокручивается каркас, а не форма',
      !!appStyle && appStyle.overflowY === 'auto',
      appStyle ? appStyle.overflowY : 'нет .app');

    /* 3i. Редактируемая таблица БЕЗ приёмника (своя форма, собранная из
       минимального IR): подсказка обязана говорить про добавление строки, а не
       про сканер с другого экрана, и строка должна добавляться в IR. */
    const editableIr = {
      type: 'форма',
      заголовокФормы: 'Правка таблицы',
      children: [
        { type: 'стили', кнопка: '#4ade80' },
        {
          type: 'операция', 'ид': 'op1', имя: 'Правка', имяКнопки: 'Сохранить',
          children: [{
            type: 'поля',
            children: [{
              type: 'таблица', 'ид': 't1', имя: 'Строки',
              'редактируемая': 'да',
              шапка: ['Товар', 'Кол-во'],
              именаВПриемнике: ['Номенклатура', 'Количество'],
              типы: ['Строка', 'Число'],
              измерения: ['Товар'],
              ресурсы: ['Кол-во'],
              children: []
            }]
          }]
        }
      ]
    };
    const editFrame = document.createElement('iframe');
    editFrame.style.cssText = 'position:fixed;left:-9999px;top:0;width:356px;height:471px;border:0';
    editFrame.srcdoc = buildFormPage(JSON.stringify(editableIr, null, 2));
    document.body.appendChild(editFrame);
    let editDoc = null;
    let editWin = null;
    for (let attempt = 0; attempt < 40; attempt++) {
      await new Promise(resolve => setTimeout(resolve, 100));
      try { editDoc = editFrame.contentDocument; } catch (e) { editDoc = null; }
      editWin = editDoc && editDoc.defaultView;
      if (editWin && editDoc.querySelector('.row-add')) break;
    }
    if (editWin && editDoc) {
      const editEmpty = editDoc.querySelector('.empty');
      expect('таблица без приёмника: подсказка про добавление строки, а не про сканер',
        !!editEmpty && editEmpty.textContent.indexOf('Добавьте строку') !== -1 &&
        editEmpty.textContent.indexOf('Отсканируйте') === -1,
        editEmpty ? editEmpty.textContent.trim() : 'нет .empty');
      const editAdd = editDoc.querySelector('.row-add');
      if (editAdd) editAdd.click();
      const editRows = editDoc.querySelectorAll('#t1 tbody tr').length;
      const editIr = editWin.readParams();
      const editTable = (editIr.children || [])
        .filter(node => node['ид'] === 'op1')
        .map(node => (node.children || [])[0])
        .map(grid => (grid.children || [])[0])
        .filter(el => el && el['ид'] === 't1')[0];
      expect('таблица без приёмника: кнопка добавляет строку и в DOM, и в IR',
        editRows === 1 && !!editTable && (editTable.children || []).length === 1,
        'DOM=' + editRows + ', IR=' + (editTable ? (editTable.children || []).length : 'нет'));
      expect('таблица без приёмника: ячейки редактируемые (data-cell-editable)',
        !!editDoc.querySelector('#t1 tbody td[data-cell-editable="1"]'),
        String(editDoc.querySelectorAll('#t1 tbody td[data-cell-editable="1"]').length) + ' ячеек');
    } else {
      report.push('INFO таблица без приёмника: кадр не поднялся');
    }
    editFrame.remove();
  } else {
    report.push('INFO нет доступа к iframe.contentDocument (file:// origin)');
  }

  /* 3d. Кнопка «JSON»: перехватываем скачивание и проверяем сам файл.
     IR берём из #ir — это тот же текст, что собран из разметки примера. */
  let saved = null;
  const realCreate = URL.createObjectURL;
  const realClick = HTMLAnchorElement.prototype.click;
  URL.createObjectURL = function (blob) { saved = { blob: blob }; return 'blob:smoke'; };
  HTMLAnchorElement.prototype.click = function () { if (saved) saved.fileName = this.download; };
  try {
    if (configBtn) configBtn.click();
  } finally {
    URL.createObjectURL = realCreate;
    HTMLAnchorElement.prototype.click = realClick;
  }

  const savedText = saved && saved.blob ? await saved.blob.text() : '';
  const expectedConfig = document.getElementById('ir').textContent.trim();
  expect('кнопка «JSON» скачивает файл .json',
    !!saved && /\.json$/.test(saved.fileName || ''),
    saved ? String(saved.fileName) : 'скачивания не было');
  expect('в файле конфига — IR примера (побайтово)',
    !!savedText && savedText.trim() === expectedConfig,
    savedText ? String(savedText.length) + ' символов' : 'файла нет');
  expect('конфиг — объект формы с детьми',
    /^\{\s*"type": "форма"/.test(savedText) && savedText.indexOf('"children"') !== -1,
    savedText.slice(0, 40));

  /* 3e. Кнопка «HTML»: та же страница, но без preview-заглушек. */
  saved = null;
  URL.createObjectURL = function (blob) { saved = { blob: blob }; return 'blob:smoke'; };
  HTMLAnchorElement.prototype.click = function () { if (saved) saved.fileName = this.download; };
  try {
    if (htmlBtn) htmlBtn.click();
  } finally {
    URL.createObjectURL = realCreate;
    HTMLAnchorElement.prototype.click = realClick;
  }

  const pageText = saved && saved.blob ? await saved.blob.text() : '';
  expect('кнопка «HTML» скачивает файл .html',
    !!saved && /\.html$/.test(saved.fileName || ''),
    saved ? String(saved.fileName) : 'скачивания не было');
  expect('HTML — самостоятельная страница формы',
    /^\s*<!DOCTYPE html>/i.test(pageText) &&
    pageText.indexOf('data id="form-params"') !== -1 &&
    pageText.indexOf('"заголовокФормы"') !== -1,
    pageText ? String(pageText.length) + ' символов' : 'файла нет');
  expect('в HTML есть защита от устаревшего localStorage',
    pageText.indexOf('ffCurrent') !== -1 &&
    pageText.indexOf('ffSaved.ir') !== -1,
    'нет standalone-скрипта проверки IR');
  expect('в HTML нет preview-заглушек',
    pageText.indexOf('window.setFocus = function () {};') === -1 &&
    pageText.indexOf('/* ЯРБП: предпросмотр формы') === -1,
    'страница должна быть без редакторских правок');

  /* 3f. Кнопка «мок-сервер»: скачивается один Python-модуль со всеми тремя
     контрактами (hook, processing, health). */
  saved = null;
  URL.createObjectURL = function (blob) { saved = { blob: blob }; return 'blob:smoke'; };
  HTMLAnchorElement.prototype.click = function () { if (saved) saved.fileName = this.download; };
  try {
    if (mockBtn) mockBtn.click();
  } finally {
    URL.createObjectURL = realCreate;
    HTMLAnchorElement.prototype.click = realClick;
  }

  const mockText = saved && saved.blob ? await saved.blob.text() : '';
  expect('кнопка «мок-сервер» скачивает файл .py',
    !!saved && /\.py$/.test(saved.fileName || ''),
    saved ? String(saved.fileName) : 'скачивания не было');
  expect('мок-сервер: хук, отправка и health по последнему сегменту',
    mockText.indexOf('#!/usr/bin/env python3') !== -1 &&
    mockText.indexOf('def _method_name') !== -1 &&
    mockText.indexOf("== 'link'") !== -1 &&
    mockText.indexOf("== 'processing'") !== -1 &&
    mockText.indexOf("('ping', 'health', 'healthz')") !== -1 &&
    mockText.indexOf('Access-Control-Allow-Origin') !== -1,
    mockText ? String(mockText.length) + ' символов' : 'файла нет');

  expect('подсказки: виды полей на месте',
    flexFormsSuggestions.nodes['группа'].variants.some(v => v.label === 'поле:штрихкод'));
  expect('подсказки: объектДляПоиска в свойствах поля',
    flexFormsSuggestions.nodes['поле'].variants.some(v => v.label === '.объектДляПоиска'));
  expect('подсказки: таблица без устаревших массивов',
    flexFormsSuggestions.nodes['таблица'].variants.some(v => v.label === ':') &&
    !flexFormsSuggestions.nodes['таблица'].variants.some(v =>
      ['..измерения', '..ресурсы', '..шапка', '..именаВПриемнике', '..типы']
        .includes(v.label)));
  expect('подсказки: свойства колонки таблицы',
    flexFormsSuggestions.nodes[''].variants.some(v => v.label === '.имя') &&
    flexFormsSuggestions.nodes[''].variants.some(v => v.label === '.измерение') &&
    flexFormsSuggestions.nodes[''].variants.some(v => v.label === '.приемник:'));
  expect('подсказки: вариант «суммировать в приемнике»',
    flexFormsSuggestions.nodes['поле'].values['.режимСканирования'].variants
      .some(v => v.label === 'суммировать в приемнике'));

  /* 4. Дебаунс и пропуск по неизменившемуся IR: печать в разметке не должна
     перезагружать iframe на каждое нажатие. */
  let mounts = 0;
  const mount = renderer.mountPreview.bind(renderer);
  renderer.mountPreview = (IR, serialized) => { mounts++; return mount(IR, serialized); };

  renderer.render();                       // тот же AST → IR тот же
  await new Promise(resolve => setTimeout(resolve, 700));
  expect('повторный render с тем же IR не перезагружает iframe', mounts === 0,
    'перезагрузок: ' + mounts);

  renderer.lastIR = 'stale';               // имитируем изменённую разметку
  renderer.render();
  expect('изменённый IR ждёт паузы в наборе (дебаунс)', mounts === 0,
    'перезагрузок сразу: ' + mounts);

  await new Promise(resolve => setTimeout(resolve, 900));
  expect('после паузы предпросмотр перерисован один раз', mounts === 1,
    'перезагрузок: ' + mounts);

  /* 5. Повторная отрисовка не сбрасывает выбор пользователя: тема и режим
     клавиатуры лежат в localStorage отдельно от снимка формы (снимок IR
     предпросмотр выбрасывает, а значения полей — сохраняет). */
  if (themeChosen && iframe) {
    let redrawn = null;
    let themeAfter = null;
    for (let attempt = 0; attempt < 40; attempt++) {
      try { redrawn = iframe.contentDocument; } catch (e) { redrawn = null; }
      themeAfter = redrawn && redrawn !== innerDoc && redrawn.documentElement
        ? redrawn.documentElement.getAttribute('data-theme') : null;
      if (themeAfter) break;
      await new Promise(resolve => setTimeout(resolve, 100));
    }
    expect('после повторного рендера тема прежняя (не сбросилась)',
      themeAfter === themeChosen,
      'выбрана ' + themeChosen + ', в новом iframe ' + themeAfter);
  }
} catch (error) {
  report.push('FAIL исключение: ' + (error && error.message ? error.message : error));
}

finish();
</script>
</body>
</html>
