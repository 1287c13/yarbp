<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>autocomplete scenario</title>
<link rel="stylesheet" href="../../src/css/editor.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #111; }
  #code-pane { position: relative; width: 900px; height: 420px; margin: 8px; }
  #code-textarea {
    width: 100%; height: 100%; box-sizing: border-box;
    padding: 10px; resize: none; border: 1px solid #ccc;
    font: 12px/1.5 'JetBrains Mono', Consolas, monospace;
    white-space: pre; overflow: auto;
  }
  #result { margin: 0; padding: 12px; white-space: pre-wrap;
    font: 12px/1.45 'JetBrains Mono', Consolas, monospace; }
</style>
</head>
<body>
<div id="code-pane">
  <textarea id="code-textarea" spellcheck="false"></textarea>
</div>
<pre id="result">running...</pre>
<script>
  window.addEventListener('unhandledrejection', (event) => {
    const box = document.getElementById('result');
    if (!box) return;
    box.textContent = 'REJECTION: ' +
      ((event.reason && (event.reason.stack || event.reason.message)) ||
       String(event.reason));
    document.title = 'AUTOCOMPLETE FAIL';
  });
  window.addEventListener('error', (event) => {
    const box = document.getElementById('result');
    if (!box) return;
    box.textContent = 'LOAD ERROR: ' + (event.message || '') +
      ' @ ' + (event.filename || '') + ':' + (event.lineno || '');
  });
</script>
<script type="module">
import { YarbpLexer, TokenTypes } from '../../src/js/core/YarbpLexer.js';
import { YarbpParser } from '../../src/js/core/YarbpParser.js';
import { YarbpFlexFormsConverter } from '../../src/js/classes/ast-converters/FlexFormsConvertor.js';
import { YarbpFlavor } from '../../src/js/classes/YarbpFlavor.js';
import { SuggestionProvider } from '../../src/js/suggestions/SuggestionProvider.js';
import { SuggestionUI } from '../../src/js/suggestions/SuggestionUI.js';
import { Ticker } from '../../src/js/utils/Ticker.js';

const resultBox = document.getElementById('result');
const lines = [];
const stages = [];
let failed = 0;

function stage(name) {
  stages.push(name);
  document.title = 'AUTOCOMPLETE … ' + name;
}

function check(name, ok, detail = '') {
  if (!ok) failed++;
  lines.push((ok ? 'ok   ' : 'FAIL ') + name + (ok || !detail ? '' : ' — ' + detail));
}

function join(...parts) { return parts.join('\n'); }
function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

function fail(message) {
  const last = stages.length ? stages[stages.length - 1] : 'сценарий';
  throw new Error(last + ': ' + message);
}

/* ------------------------------------------------------------------ */
/* Стенд: настоящие SuggestionProvider/SuggestionUI и тот же контракт  */
/* клавиш, что в app.js (Tab = отступ в начале строки, Alt/Ctrl+Space — */
/* вызов, Escape — закрыть). Тяжёлый рендерер ТСД здесь не участвует.  */
/* ------------------------------------------------------------------ */
const pane = document.getElementById('code-pane');
const editor = document.getElementById('code-textarea');
const view = window;
const lexer = new YarbpLexer();
const parser = new YarbpParser(lexer);
const provider = new SuggestionProvider();
const ticker = new Ticker();
const ui = new SuggestionUI(editor, pane);
const popup = ui.root;

let pendingUpdateFrame = 0;
let lastAST = null;

function currentFlavor() {
  const directive = lexer.tokens.find(token =>
    token.type === TokenTypes.DIRECTIVE &&
    YarbpFlavor.isFlavorDirective(token.value));
  return new YarbpFlavor(directive ? directive.value : 'as lexer');
}

function scheduleSuggestions(flavor, ast, force = false) {
  ticker.schedule(() => {
    const result = provider.update({
      tokens: lexer.tokens,
      ast,
      cursorOffset: editor.selectionStart,
      text: editor.value,
      flavor,
      force,
    });
    if (result) ui.show(result);
    else ui.hide();
  });
}

function updateViews() {
  lexer.setInitialState(editor.value);
  lexer.tokenize();

  let ast = null;
  try {
    ast = parser.getAST();
  } catch (error) {
    console.error('[autocomplete-test] AST build failed:', error);
  }
  lastAST = ast;

  scheduleSuggestions(currentFlavor(), ast);
}

function scheduleUpdateViews() {
  if (pendingUpdateFrame) return;

  pendingUpdateFrame = requestAnimationFrame(() => {
    pendingUpdateFrame = 0;
    updateViews();
  });

  // Страховка для headless: rAF может не прийти, а подсказки должны обновиться.
  setTimeout(() => {
    if (!pendingUpdateFrame) return;
    cancelAnimationFrame(pendingUpdateFrame);
    pendingUpdateFrame = 0;
    updateViews();
  }, 100);
}

function fireInput() {
  editor.dispatchEvent(new view.Event('input', { bubbles: true }));
}

editor.addEventListener('input', scheduleUpdateViews);

/* Тот же контракт, что в app.js: каретка, поставленная мышью, пересобирает
   подсказки для новой позиции, а не оставляет меню на старом месте. */
function resuggestForCaret() {
  if (document.activeElement !== editor) return;
  if (!ui.isOpen()) return;
  scheduleSuggestions(currentFlavor(), lastAST);
}

editor.addEventListener('mouseup', resuggestForCaret);
document.addEventListener('selectionchange', resuggestForCaret);

/* Та же арифметика, что в app.js: Tab выравнивает по границе отступа. */
function tabSpaces(text, offset, width = 2) {
  const lineStart = text.lastIndexOf('\n', offset - 1) + 1;
  let col = 0;
  for (let i = lineStart; i < offset; i++) {
    col += text[i] === '\t' ? width - (col % width) : 1;
  }
  return width - (col % width);
}

/* Ctrl+Z в браузере — нативная отмена, а синтетическое событие клавиши
   встроенное действие не запускает. Стенд вызывает ту же команду напрямую:
   если правка не попала в историю отмены, значение не изменится. */
function undoEdit() {
  const ok = document.execCommand('undo');
  fireInput();
  return ok;
}

editor.addEventListener('keydown', (e) => {
  if (ui.handleKey(e)) return;

  const isAlt = e.key === 'Alt' && !e.shiftKey && !e.ctrlKey && !e.metaKey;
  const isCtrlSpace = e.code === 'Space' && e.ctrlKey &&
    !e.altKey && !e.shiftKey && !e.metaKey;

  if (isAlt || isCtrlSpace) {
    e.preventDefault();

    let ast = null;
    try {
      ast = parser.getAST();
    } catch (error) {
      console.error('[autocomplete-test] AST build failed:', error);
    }

    scheduleSuggestions(currentFlavor(), ast, true);
    return;
  }

  if (['ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown']
      .includes(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    ui.hide();
  }

  if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;

    if (start === end) {
      const spaces = ' '.repeat(tabSpaces(editor.value, start));
      const before = editor.value;
      document.execCommand('insertText', false, spaces);
      if (editor.value === before) {
        editor.setRangeText(spaces, start, start, 'end');
      }
      const caret = start + spaces.length;
      editor.setSelectionRange(caret, caret);
    }

    fireInput();
  } else if (e.key === 'Tab' && e.shiftKey) {
    e.preventDefault();
    const start = editor.selectionStart;
    let spaces = 0;

    if (start >= 2 && editor.value.slice(start - 2, start) === '  ') spaces = 2;
    else if (start >= 1 && editor.value[start - 1] === ' ') spaces = 1;

    if (spaces > 0) {
      const before = editor.value;
      const target = start - spaces;
      editor.setSelectionRange(target, start);
      document.execCommand('insertText', false, '');
      if (editor.value === before) {
        editor.setRangeText('', target, start, 'end');
      }
      editor.setSelectionRange(target, target);
    }

    fireInput();
  }
});

stage('harness ready');
check('стенд: поле ввода и меню подсказок созданы',
  !!editor && !!popup);

function type(text, delay = 180) {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  editor.setRangeText(text, start, end, 'end');
  fireInput();
  return wait(delay);
}

function newline(indent, delay = 180) {
  return type('\n' + ' '.repeat(Math.max(0, indent)), delay);
}

function press(key, options = {}, delay = 180) {
  const event = new view.KeyboardEvent('keydown', {
    key,
    code: options.code || key,
    bubbles: true,
    cancelable: true,
    ...options,
  });
  editor.dispatchEvent(event);
  return wait(delay).then(() => event);
}

function menuOpen() {
  return !!popup && popup.hidden === false;
}

function menuState() {
  if (!menuOpen()) return 'closed';
  return popup.classList.contains('hint-mode') ? 'hint' : 'list';
}

function labels() {
  return Array.from(popup.querySelectorAll('.suggestion-list li'))
    .map(item => item.textContent.trim());
}

function activeLabel() {
  const active = popup.querySelector('.suggestion-list li.active');
  return active ? active.textContent.trim() : '';
}

function hintText() {
  const hint = popup.querySelector('.suggestion-hint');
  return hint && !hint.hidden ? hint.textContent.trim() : '';
}

/**
 * Виден ли список на самом деле. `popup.hidden === false` этого не доказывает:
 * popup мог остаться пустой рамкой («тонкая полоска»), если список спрятали
 * после отрисовки.
 */
function listVisible() {
  if (!popup || popup.hidden) return false;
  const list = popup.querySelector('.suggestion-list');
  if (!list || list.hidden) return false;
  return list.offsetHeight > 0 && popup.getBoundingClientRect().height > 0;
}

async function waitState(state, timeout = 1200) {
  // Счётчик попыток, а не Date.now(): в headless-режиме с
  // --virtual-time-budget часы могут стоять, пока таймеры «перематываются».
  const attempts = Math.max(1, Math.ceil(timeout / 40));
  for (let attempt = 0; attempt < attempts; attempt++) {
    // Для списка мало `hidden === false`: popup мог схлопнуться в пустую
    // рамку. Ждём, пока список реально займёт высоту.
    if (menuState() === state && (state !== 'list' || listVisible())) return true;
    await wait(40);
  }
  return menuState() === state && (state !== 'list' || listVisible());
}

async function waitLabels(expected, timeout = 900) {
  const attempts = Math.max(1, Math.ceil(timeout / 60));
  for (let attempt = 0; attempt < attempts; attempt++) {
    if (menuState() === 'list' && labels().includes(expected)) return true;
    await wait(60);
  }
  return menuState() === 'list' && labels().includes(expected);
}

function activate(label) {
  for (let attempt = 0; attempt < 30; attempt++) {
    if (activeLabel().startsWith(label)) return true;
    editor.dispatchEvent(new view.KeyboardEvent('keydown', {
      key: 'ArrowDown', code: 'ArrowDown', bubbles: true, cancelable: true,
    }));
  }
  return activeLabel().startsWith(label);
}

/**
 * Набрать префикс, дождаться списка, проверить ожидаемый вариант и принять
 * его клавишей Tab — ровно так, как это делает пользователь.
 */
async function complete(prefix, expected, name) {
  await type(prefix);

  let opened = await waitState('list');
  if (opened && !labels().includes(expected)) {
    opened = await waitLabels(expected);
  }
  const items = labels();

  if (!opened || !items.includes(expected)) {
    fail('после «' + prefix + '» нет «' + expected + '» (' +
      menuState() + ': ' + items.join(' | ') + ')');
  }

  check(name + ': после «' + prefix + '» открыт список', true);
  check(name + ': в списке есть «' + expected + '»', true);

  const active = activate(expected);
  if (!active) {
    fail('не удалось выбрать «' + expected + '» (активен «' +
      activeLabel() + '»)');
  }
  check(name + ': активен ожидаемый вариант', true);

  await press('Tab', {}, 200);
  return true;
}

async function expectHint(name) {
  const ok = await waitState('hint');
  if (!ok) {
    fail(name + ': ожидалась подсказка, а не список (' +
      menuState() + ': ' + labels().join(' | ') + ')');
  }
  const text = hintText();
  if (!text.includes('▼') || !text.includes('Alt')) {
    fail(name + ': подсказка должна быть «▼ Alt», получено «' + text + '»');
  }
  if (text.includes('Tab')) {
    fail(name + ': подсказка не должна объяснять Tab («' + text + '»)');
  }
  check(name + ': показана подсказка «▼ Alt», а не список', true);
}

function expectText(name, expected) {
  if (editor.value !== expected) {
    fail(name + ': ожидался текст ' + JSON.stringify(expected) +
      ', получен ' + JSON.stringify(editor.value.slice(-200)));
  }
  check(name, true);
}

let source = '';

try {

stage('scenario: empty');
/* ------------------------------------------------------------------ */
/* 1. Пустой документ: hint вместо списка, Tab = отступ, меню скрывается */
/* ------------------------------------------------------------------ */
editor.value = '';
editor.focus();
editor.setSelectionRange(0, 0);
fireInput();
await wait(250);

await expectHint('пустой документ');
check('hint-режим: только чип, без списка и доков',
  popup.querySelector('.suggestion-list').hidden &&
  popup.querySelector('.suggestion-block-doc').hidden &&
  popup.querySelector('.suggestion-item-doc').hidden, menuState());

const beforeTab = editor.value;
const tabEvent = await press('Tab', {}, 180);
check('Tab в начале строки обработан редактором, а не меню',
  tabEvent.defaultPrevented);
check('Tab в начале строки вставил ровно два пробела',
  editor.value === beforeTab + '  ', JSON.stringify(editor.value));
check('Tab в начале строки не принял подсказку',
  editor.value.trim() === '', JSON.stringify(editor.value));

await press('Tab', { shiftKey: true }, 180);
check('Shift+Tab убрал отступ',
  editor.value === beforeTab, JSON.stringify(editor.value));

/* 1a. Tab выравнивает по границе отступа, а не докидывает два пробела */
editor.value = 'x'.repeat(11);
editor.setSelectionRange(11, 11);
fireInput();
await press('Tab', {}, 120);
check('Tab на нечётном столбце дополнил отступ до чётного (один пробел)',
  editor.value === 'x'.repeat(11) + ' ', JSON.stringify(editor.value.slice(11)));

await press('Tab', {}, 120);
check('второй Tab с чётного столбца дал два пробела',
  editor.value === 'x'.repeat(11) + '   ', JSON.stringify(editor.value.slice(11)));

editor.value = '  abc';
editor.setSelectionRange(5, 5);
fireInput();
await press('Tab', {}, 120);
check('Tab на нечётном столбце внутри строки дал один пробел',
  editor.value === '  abc ', JSON.stringify(editor.value));

editor.value = '  abcd';
editor.setSelectionRange(6, 6);
fireInput();
await press('Tab', {}, 120);
check('Tab на чётном столбце внутри строки дал два пробела',
  editor.value === '  abcd  ', JSON.stringify(editor.value));

/* Дальше сценарий снова работает с пустым документом. */
editor.value = beforeTab;
editor.setSelectionRange(0, 0);
fireInput();
await wait(200);

await press('Alt', { altKey: true }, 250);
let opened = await waitState('list');
let items = labels();
check('Alt открывает меню в пустом документе', opened, menuState());
check('Alt: список раскрыт, а не пустая рамка', listVisible(),
  'popup height=' + Math.round(popup.getBoundingClientRect().height));
check('в пустом документе предлагаются директивы',
  items.includes('! как') && items.includes('! импорт') &&
  items.includes('! типизация-сахара') &&
  items.includes('! отключить идентификаторы') && items.includes('! disable ids'),
  items.join(' | '));

await press('Escape', {}, 160);
check('Escape скрывает меню', !menuOpen(), menuState());
check('Escape не меняет текст', editor.value === beforeTab,
  JSON.stringify(editor.value));

await press(' ', { code: 'Space', ctrlKey: true }, 250);
opened = await waitState('list');
check('Ctrl+Space снова открывает меню', opened, menuState());
await press('Escape', {}, 160);

stage('scenario: undo');
/* ------------------------------------------------------------------ */
/* 1b. Ctrl+Z отменяет автоподстановку: вставка идёт нативной командой, */
/*     поэтому попадает в историю отмены и возвращает набранный префикс */
/* ------------------------------------------------------------------ */
editor.value = '! как форма-тсд\nформа\n  .за';
editor.setSelectionRange(editor.value.length, editor.value.length);
fireInput();
const undoOpened = await waitState('list');
check('undo: список открыт для набранного префикса', undoOpened, menuState());
check('undo: в списке есть «.заголовокФормы»',
  await waitLabels('.заголовокФормы'), labels().slice(0, 5).join(' | '));

const undoActive = activate('.заголовокФормы');
check('undo: активен ожидаемый вариант', undoActive, activeLabel());

const prefixText = editor.value;
await press('Tab', {}, 220);
check('undo: Tab подставил ключ',
  editor.value !== prefixText && editor.value.includes('.заголовокФормы'),
  JSON.stringify(editor.value.slice(-30)));

undoEdit();
await wait(200);
check('undo: Ctrl+Z вернул набранный префикс',
  editor.value === prefixText, JSON.stringify(editor.value.slice(-30)));
check('undo: отмена не тронула остальной текст',
  editor.value.startsWith('! как форма-тсд\nформа\n  .за'));

stage('scenario: caret');
/* ------------------------------------------------------------------ */
/* 2a. Каретка, поставленная мышью: меню переезжает к новой позиции и  */
/*     пересобирает подсказки для неё, а не висит на старом месте.     */
/* ------------------------------------------------------------------ */
editor.value = '! как форма-тсд\nформа\n  .заголовокФормы\n  .з';
editor.setSelectionRange(editor.value.length, editor.value.length);
fireInput();
opened = await waitState('list');
check('каретка: список свойств формы открыт в конце документа',
  opened && labels()[0] === '.заголовокФормы',
  menuState() + ': ' + labels().slice(0, 3).join(' | '));

const caretPosBefore = popup.style.left + ',' + popup.style.top;
const directiveEnd = '! как форма-тсд'.length;
editor.setSelectionRange(directiveEnd, directiveEnd);
editor.dispatchEvent(new view.MouseEvent('mouseup', { bubbles: true }));
await wait(320);

const caretPosAfter = popup.style.left + ',' + popup.style.top;
check('каретка: меню переехало к новой позиции',
  caretPosBefore !== caretPosAfter,
  caretPosBefore + ' → ' + caretPosAfter);
check('каретка: подсказки пересчитаны под новую позицию',
  menuState() === 'list' && labels()[0] === 'форма-тсд' &&
  popup.querySelector('.suggestion-block-doc').textContent ===
    'Здесь вы можете выбрать конвертер',
  menuState() + ': ' + labels().slice(0, 3).join(' | '));

await press('Escape', {}, 160);
editor.setSelectionRange(editor.value.length, editor.value.length);
editor.dispatchEvent(new view.MouseEvent('mouseup', { bubbles: true }));
await wait(220);
check('каретка: клик по тексту не открывает закрытое меню', !menuOpen(),
  menuState());

editor.value = '';
editor.setSelectionRange(0, 0);
fireInput();
await wait(220);

stage('scenario: directive');
/* ------------------------------------------------------------------ */
/* 2. Начало документа только подсказками: ! как форма-тсд            */
/* ------------------------------------------------------------------ */
await type('!');
opened = await waitState('list');
items = labels();
check('после «!» список директив обновлён', opened, menuState());
check('в списке после «!» шесть директив', items.length === 6,
  items.join(' | '));

await type('к');
await wait(300);
items = labels();
check('ввод «к» поднимает директиву «как», не сужая список',
  items.length === 6 && items[0] === 'как', items.join(' | '));

await press('Tab', {}, 250);
expectText('директива вставлена целиком', '! как ');
check('курсор после директивы', editor.selectionStart === editor.value.length,
  String(editor.selectionStart));

opened = await waitState('list');
items = labels();
check('после «! как » предложены конвертеры',
  opened && items.includes('форма-тсд'), items.join(' | '));

await type('ф');
await wait(300);
items = labels();
check('буква «ф» поднимает формы наверх, остальные конвертеры остаются',
  items[0] === 'форма-тсд' && items[1] === 'форма' &&
  items.includes('кпо') && items.includes('джейсон'), items.join(' | '));

await type('орма-т');
await wait(300);
items = labels();
check('уточнение «орма-т» ставит «форма-тсд» первым вариантом',
  items[0] === 'форма-тсд', items.join(' | '));

await press('Tab', {}, 250);
expectText('конвертер вставлен с переводом строки',
  '! как форма-тсд\n');

await expectHint('строка после директивы');
await press('Tab', {}, 180);
check('Tab после директивы делает отступ',
  editor.value === '! как форма-тсд\n  ', JSON.stringify(editor.value));
await press('Tab', { shiftKey: true }, 180);

await press('Alt', { altKey: true }, 250);
opened = await waitState('list');
items = labels();
check('после директивы Alt показывает корень формы',
  opened && items.includes('форма'), items.join(' | '));
await press('Tab', {}, 250);
expectText('корень «форма» вставлен шаблоном',
  '! как форма-тсд\nформа\n  ');

await expectHint('внутри формы');

stage('scenario: empty directive');
/* ------------------------------------------------------------------ */
/* 2b. «! » — директива без тела: восклицательный знак обязан входить  */
/*     в неё, иначе замена начинается после `!` и Tab вставляет второй. */
/* ------------------------------------------------------------------ */
editor.value = '';
editor.setSelectionRange(0, 0);
fireInput();
await wait(220);

await type('! ');
opened = await waitState('list');
items = labels();
check('после «! » открыт список директив', opened, menuState());
check('после «! » шесть директив, «как» первая',
  items.length === 6 && items[0].replace(/^!\s*/, '') === 'как',
  items.join(' | '));

await press('Tab', {}, 250);
expectText('вставка после «! » не дублирует восклицательный знак', '! как ');

/* Стенд возвращается к состоянию сценария 3. */
editor.value = '! как форма-тсд\nформа\n  ';
editor.setSelectionRange(editor.value.length, editor.value.length);
fireInput();

const lexer = new YarbpLexer();
lexer.setInitialState(source);
lexer.tokenize();

const badTokens = lexer.tokens.filter(token => token.type === 'UNPARSED');
check('итог: лексер не оставил неразобранных токенов',
  badTokens.length === 0,
  badTokens.map(token => token.value + ':' + token.error).join(' | '));

let ast = null;
try {
  ast = new YarbpParser(lexer).getAST();
} catch (error) {
  check('итог: AST собран без исключения', false, String(error));
}
check('итог: AST собран', !!ast);

let diagnostics = [];
let ir = null;
if (ast) {
  const parser = new YarbpParser(lexer);
  ast = parser.getAST();
  diagnostics = parser.lastDiagnostics || [];
  check('итог: нет диагностик разбора',
    diagnostics.length === 0, JSON.stringify(diagnostics).slice(0, 300));

  try {
    ir = new YarbpFlexFormsConverter(ast).convert();
  } catch (error) {
    check('итог: конвертер ТСД собрал IR', false, String(error));
  }
}

check('IR: корень — форма', !!ir && ir.type === 'форма');

function collectNodes(node, output) {
  if (!node || typeof node !== 'object') return output;
  if (Array.isArray(node)) {
    node.forEach(item => collectNodes(item, output));
    return output;
  }
  if (node.type) output.push(node);
  if (Array.isArray(node.children)) {
    node.children.forEach(item => collectNodes(item, output));
  }
  return output;
}
