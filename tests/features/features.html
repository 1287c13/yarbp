<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>features cases</title>
  <style>
    body { margin: 0; padding: 16px; background: #ffffff; color: #111111;
      font: 12px/1.5 'JetBrains Mono', Consolas, monospace; }
    #result { margin: 0; white-space: pre-wrap; }
  </style>
</head>
<body>
<pre id="result">running...</pre>

<script>
  window.addEventListener('error', (event) => {
    const box = document.getElementById('result');
    if (!box) return;
    box.textContent = 'LOAD ERROR: ' + (event.message || '') +
      ' @ ' + (event.filename || '') + ':' + (event.lineno || '');
  });
</script>

<script type="module">
  import { YarbpLexer, TokenTypes } from '../../src/js/core/YarbpLexer.js';
  import { YarbpParser, valueTypes } from '../../src/js/core/YarbpParser.js';
  import { YarbpJSONConverter } from '../../src/js/classes/ast-converters/JSONConvertor.js';
  import { YarbpXMLConverter } from '../../src/js/classes/ast-converters/XMLConvertor.js';
  import { YarbpProtoConverter } from '../../src/js/classes/ast-converters/ProtobufConvertor.js';
  import { YarbpHighlighter } from '../../src/js/classes/highlighters/YarbpHighlighter.js';
  import { CodeBlockHighlighter } from '../../src/js/classes/highlighters/CodeBlockHighlighter.js';
  import { SuggestionProvider } from '../../src/js/suggestions/SuggestionProvider.js';
  import {
    CodeBlockHighlightPass,
    CODE_BLOCK_HIGHLIGHT_DELAY_MS
  } from '../../src/js/classes/highlighters/CodeBlockHighlightPass.js';
  import { UIGenerator } from '../../src/js/classes/UIGenerator.js';
import { UIRuntime } from '../../src/js/classes/ui/UIRuntime.js';
import { HTMLExporter } from '../../src/js/classes/HTMLExporter.js';
import { FileManager } from '../../src/js/modules/FileManager.js';
import { YarbpFlavor } from '../../src/js/classes/YarbpFlavor.js';
import { unionOutlines } from '../../src/js/classes/highlighters/FlavorFrames.js';

  const resultBox = document.getElementById('result');
  const lines = [];
  let failed = 0;

  function check(name, ok, detail = '') {
    if (!ok) failed++;
    lines.push((ok ? 'ok   ' : 'FAIL ') + name + (ok || !detail ? '' : ' — ' + detail));
  }

  const join = (...parts) => parts.join('\n');

  function build(code) {
    const lexer = new YarbpLexer();
    lexer.setInitialState(code);
    lexer.tokenize();
    const parser = new YarbpParser(lexer);
    const ast = parser.getAST();
    return { code, lexer, parser, ast, tokens: lexer.tokens };
  }

  function child(node, key) {
    return (node && node.children || []).find(item => item.key === key);
  }

  function children(node) {
    return (node && node.children) || [];
  }

  /* ------------------------------------------------------------------ */
  /* 1. Подстановка (( имя )) вне макроса                                */
  /* ------------------------------------------------------------------ */
  const SUB = join('! as ast', 'а .б (( с ))', '.с д');
  const sub = build(SUB);
  const subA = child(sub.ast, 'а');
  const subB = child(subA, 'б');

  check('подстановка 2.3: значение из ключа нулевого уровня',
    !!subB && subB.value === 'д', subB ? String(subB.value) : 'нет узла');
  check('подстановка 2.3: ключ-источник убран из вывода',
    child(sub.ast, 'с') === undefined);

  const SUB_MULTI = join('! as ast', ': .x (( с )) .y (( с ))', '.с д');
  const subMulti = build(SUB_MULTI);
  const anon = children(subMulti.ast).find(item => item.valueType === valueTypes.OBJECT && !item.key);
  const multiX = child(anon, 'x');
  const multiY = child(anon, 'y');

  check('подстановка: несколько использований',
    !!multiX && !!multiY && multiX.value === 'д' && multiY.value === 'д',
    String(multiX && multiX.value) + ' / ' + String(multiY && multiY.value));
  check('подстановка: источник убран один раз',
    child(subMulti.ast, 'с') === undefined);

  const SUB_MISSING = join('! as ast', 'а .б (( нет ))');
  const subMissing = build(SUB_MISSING);
  const missingB = child(child(subMissing.ast, 'а'), 'б');

  check('подстановка: отсутствующий ключ оставлен как есть',
    !!missingB && missingB.value === '(( нет ))',
    missingB ? String(missingB.value) : 'нет узла');
  check('подстановка: отсутствующий ключ даёт понятную диагностику',
    subMissing.parser.lastDiagnostics.some(item => /нет ключа/.test(item.message)),
    JSON.stringify(subMissing.parser.lastDiagnostics));

  const SUB_OBJECT = join(
    '! as ast',
    ':конфиг',
    '  .а 1',
    '  .б 2',
    'пример',
    '  .настройки (( конфиг ))'
  );
  const subObject = build(SUB_OBJECT);
  const settings = child(child(subObject.ast, 'пример'), 'настройки');

  check('подстановка: объект подставляется содержимым',
    !!settings && settings.valueType === valueTypes.OBJECT &&
    children(settings).length === 2 &&
    !!child(settings, 'а') && !!child(settings, 'б'),
    settings ? settings.valueType + ' / ' + children(settings).length : 'нет узла');
  check('подстановка: объект-источник убран',
    child(subObject.ast, 'конфиг') === undefined);

  const MACRO = join(
    '! as ast',
    '.id root',
    '@a',
    '  .id item-(( id ))',
    'k',
    '  x(a)',
    '    .id 1'
  );
  const macro = build(MACRO);
  const macroX = child(child(macro.ast, 'k'), 'x');
  const macroId = child(macroX, 'id');

  check('макросы: параметр (( id )) раскрыт как раньше',
    !!macroId && macroId.value === 'item-1',
    macroId ? String(macroId.value) : 'нет узла');
  check('макросы: ключ нулевого уровня с тем же именем не подменяет параметр',
    !!child(macro.ast, 'id') && child(macro.ast, 'id').value === 'root',
    JSON.stringify(child(macro.ast, 'id')));
  /* ------------------------------------------------------------------ */
  /* 1b. Идентификатор узла `#id`                                        */
  /* ------------------------------------------------------------------ */
  const ID_CODE = join(
    '! as ast',
    ':группа#order:форма',
    '  .поле#итог:целое 5',
    '  ..табы#список',
    '    :таб#первый .подпись Список'
  );
  const idParsed = build(ID_CODE);
  const idGroup = child(idParsed.ast, 'группа');
  const idField = child(idGroup, 'поле');
  const idTabs = child(idGroup, 'табы');
  const idTab = child(idTabs, 'таб');

  check('#id: ключ, id и тип — поля одного узла',
    !!idGroup && idGroup.key === 'группа' && idGroup.id === 'order' &&
    idGroup.type === 'форма',
    idGroup ? JSON.stringify({ key: idGroup.key, id: idGroup.id, type: idGroup.type })
      : 'нет узла');
  check('#id: примитив получает id, ключ, тип и значение',
    !!idField && idField.key === 'поле' && idField.id === 'итог' &&
    idField.type === 'целое' && idField.value === 5,
    idField ? JSON.stringify({ key: idField.key, id: idField.id,
      type: idField.type, value: idField.value }) : 'нет узла');
  check('#id: работает у массива и у элемента массива',
    !!idTabs && idTabs.id === 'список' && idTabs.valueType === valueTypes.ARRAY &&
    !!idTab && idTab.id === 'первый' && idTab.key === 'таб',
    JSON.stringify({ tabs: idTabs && idTabs.id, tab: idTab && idTab.id }));
  check('#id: ключ больше не содержит решётку',
    [idGroup, idField, idTabs, idTab].every(node => node && !String(node.key).includes('#')),
    JSON.stringify([idGroup, idField, idTabs, idTab].map(node => node && node.key)));

  const ID_PARTIAL = build(join('! as ast', 'поле# .а 1', '#итог .б 2'));
  check('#id: пустая половина — не идентификатор',
    children(ID_PARTIAL.ast).every(node => node.id === undefined) &&
    !!child(ID_PARTIAL.ast, 'поле#') && !!child(ID_PARTIAL.ast, '#итог'),
    JSON.stringify(children(ID_PARTIAL.ast).map(node => [node.key, node.id])));

  const IDS_OFF = join('! as ast', '! отключить идентификаторы', '.поле#итог:целое 5');
  const idsOff = build(IDS_OFF);
  check('! отключить идентификаторы: id остаётся частью ключа',
    !!child(idsOff.ast, 'поле#итог') &&
    child(idsOff.ast, 'поле#итог').id === undefined &&
    child(idsOff.ast, 'поле#итог').type === 'целое',
    JSON.stringify(children(idsOff.ast).map(node => [node.key, node.id])));

  const IDS_OFF_EN = build(join('! as ast', '! disable ids', '.поле#итог 5'));
  check('! disable ids: англоязычный аналог отключает id',
    !!child(IDS_OFF_EN.ast, 'поле#итог') &&
    child(IDS_OFF_EN.ast, 'поле#итог').id === undefined,
    JSON.stringify(children(IDS_OFF_EN.ast).map(node => [node.key, node.id])));

  const IDS_OFF_LATE = build(join('! as ast', '.поле#итог 5', '! отключить идентификаторы'));
  check('идентификаторы: директива действует на весь документ',
    !!child(IDS_OFF_LATE.ast, 'поле#итог') &&
    child(IDS_OFF_LATE.ast, 'поле#итог').id === undefined,
    JSON.stringify(children(IDS_OFF_LATE.ast).map(node => [node.key, node.id])));

  /* Поле `id` — не только для конвертеров: UI-форма берёт имя элемента из id. */
  const idFormHost = document.createElement('div');
  idFormHost.innerHTML = new UIGenerator(false).generateHTML(
    build(join('! как форма', 'форма#f', '  поле#итог 5')).ast);
  const idFormField = idFormHost.querySelector('[data-element-path="итог"]');
  check('UI: id узла становится именем элемента формы',
    !!idFormField,
    idFormHost.innerHTML.slice(0, 200));

  /* ------------------------------------------------------------------ */
  /* 2. Фрагмент кода                                                    */
  /* ------------------------------------------------------------------ */
  const CODE = join(
    '! as ast',
    '.код ```bsl',
    'Процедура Тест()',
    '  // комментарий',
    '  Возврат "ok";',
    'КонецПроцедуры',
    '```'
  );
  const codeCase = build(CODE);
  const codeNode = child(codeCase.ast, 'код');
  const codeText = join(
    'Процедура Тест()',
    '  // комментарий',
    '  Возврат "ok";',
    'КонецПроцедуры'
  );

  check('код-блок: примитив с valueType CODE',
    !!codeNode && codeNode.valueType === valueTypes.CODE,
    codeNode ? codeNode.valueType : 'нет узла');
  check('код-блок: язык сохранён',
    !!codeNode && codeNode.language === 'bsl',
    codeNode ? String(codeNode.language) : 'нет узла');
  check('код-блок: сырой текст без изменений',
    !!codeNode && codeNode.value === codeText,
    codeNode ? JSON.stringify(codeNode.value) : 'нет узла');
  check('код-блок: позиция указывает на содержимое',
    !!codeNode && codeNode.position.start === CODE.indexOf('Процедура') &&
    codeNode.position.end === CODE.indexOf('Процедура') + codeText.length,
    codeNode ? JSON.stringify(codeNode.position) : 'нет узла');
  check('код-блок: лексер не создал токенов внутри острова',
    codeCase.tokens.filter(token => (token.value || '').includes('Процедура')).length === 1 &&
    codeCase.tokens.find(token => (token.value || '').includes('Процедура')).type === TokenTypes.CODE_BLOCK,
    codeCase.tokens.map(token => token.type).join(','));

  const CODE_NO_LANG = join('! as ast', '.текст ```', 'просто текст', '<b>не тег</b>', '```');
  const codeNoLang = build(CODE_NO_LANG);
  const noLangNode = child(codeNoLang.ast, 'текст');

  check('код-блок: язык опционален (null)',
    !!noLangNode && noLangNode.valueType === valueTypes.CODE && noLangNode.language === null,
    noLangNode ? String(noLangNode.language) : 'нет узла');
  check('код-блок: без языка содержимое тоже сырое',
    !!noLangNode && noLangNode.value === join('просто текст', '<b>не тег</b>'),
    noLangNode ? JSON.stringify(noLangNode.value) : 'нет узла');

  const CODE_IN_MACRO = join(
    '! as ast',
    '@a',
    '  .код (( код ))',
    'пример',
    '  x(a)',
    '    .код ```bsl',
    '    Процедура Тест()',
    '    КонецПроцедуры',
    '    ```'
  );
  const codeMacro = build(CODE_IN_MACRO);
  const codeMacroNode = child(child(child(codeMacro.ast, 'пример'), 'x'), 'код');

  check('код-блок: работает параметром макроса',
    !!codeMacroNode && codeMacroNode.valueType === valueTypes.CODE &&
    codeMacroNode.language === 'bsl' &&
    codeMacroNode.value.includes('Процедура Тест()'),
    codeMacroNode ? codeMacroNode.valueType + '/' + codeMacroNode.language : 'нет узла');

  /* ------------------------------------------------------------------ */
  /* 3. Значение примитивного ключа с новой строки                       */
  /* ------------------------------------------------------------------ */
  const NEXT_LINE_STRING = join('! as ast', '.текст', '"', 'Многострочный', 'Текст', '"');
  const nextString = build(NEXT_LINE_STRING);
  const nextStringNode = child(nextString.ast, 'текст');

  check('значение с новой строки: многострочная строка',
    !!nextStringNode && nextStringNode.valueType === valueTypes.STRING &&
    nextStringNode.value === 'Многострочный\nТекст',
    nextStringNode ? JSON.stringify(nextStringNode.value) : 'нет узла');
  check('значение с новой строки: позиция значения, не ключа',
    !!nextStringNode && nextStringNode.position.start === NEXT_LINE_STRING.indexOf('\n"') + 1,
    nextStringNode ? String(nextStringNode.position.start) : 'нет узла');

  const NEXT_LINE_SCALARS = join(
    '! as ast',
    '.число', '42',
    '.булево', 'да',
    '.ничто', 'null',
    '.строка', "'один'"
  );
  const scalars = build(NEXT_LINE_SCALARS);

  check('значение с новой строки: число',
    child(scalars.ast, 'число')?.valueType === valueTypes.NUMBER &&
    child(scalars.ast, 'число')?.value === 42,
    JSON.stringify(child(scalars.ast, 'число')));
  check('значение с новой строки: булево',
    child(scalars.ast, 'булево')?.valueType === valueTypes.BOOL &&
    child(scalars.ast, 'булево')?.value === true,
    JSON.stringify(child(scalars.ast, 'булево')));
  check('значение с новой строки: null',
    child(scalars.ast, 'ничто')?.valueType === valueTypes.NULL &&
    child(scalars.ast, 'ничто')?.value === null,
    JSON.stringify(child(scalars.ast, 'ничто')));
  check('значение с новой строки: строка в кавычках',
    child(scalars.ast, 'строка')?.valueType === valueTypes.STRING &&
    child(scalars.ast, 'строка')?.value === 'один',
    JSON.stringify(child(scalars.ast, 'строка')));

  const NEXT_LINE_CODE = join('! as ast', '.код', '```js', 'const x = 1;', '```');
  const nextCode = build(NEXT_LINE_CODE);
  const nextCodeNode = child(nextCode.ast, 'код');

  check('значение с новой строки: фрагмент кода',
    !!nextCodeNode && nextCodeNode.valueType === valueTypes.CODE &&
    nextCodeNode.language === 'js' && nextCodeNode.value === 'const x = 1;',
    nextCodeNode ? nextCodeNode.valueType + '/' + nextCodeNode.language : 'нет узла');

  const VALUE_MISSING = join('! as ast', '.пусто', '.рядом 1');
  const valueMissing = build(VALUE_MISSING);
  const emptyNode = child(valueMissing.ast, 'пусто');

  check('значение отсутствует: AST не изменился (совместимость)',
    !!emptyNode && emptyNode.valueType === valueTypes.STRING && emptyNode.value === '',
    JSON.stringify(emptyNode));
  check('значение отсутствует: диагностика «ожидалось значение»',
    valueMissing.lexer.diagnostics.some(item => item.message === 'expected value'),
    JSON.stringify(valueMissing.lexer.diagnostics));
  check('значение отсутствует: следующий узел разобран отдельно',
    child(valueMissing.ast, 'рядом')?.value === 1,
    JSON.stringify(child(valueMissing.ast, 'рядом')));

  const CODE_UNCLOSED = join('! as ast', '.код ```bsl', 'Процедура Тест()');
  const codeUnclosed = build(CODE_UNCLOSED);
  check('код-блок: незакрытый блок — понятная ошибка',
    codeUnclosed.tokens.some(token =>
      token.type === TokenTypes.UNPARSED && token.error === 'unterminated code block'),
    JSON.stringify(codeUnclosed.tokens.filter(token => token.error)));

  /* ------------------------------------------------------------------ */
  /* 4. Конвертеры не падают на фрагменте кода                           */
  /* ------------------------------------------------------------------ */
  const codeJson = new YarbpJSONConverter(codeCase.ast).convert();
  check('json: фрагмент кода отдаётся сырым текстом',
    !!codeJson && typeof codeJson.код === 'string' && codeJson.код === codeText,
    JSON.stringify(codeJson));

  let codeXml = '';
  let codeXmlError = '';
  try { codeXml = new YarbpXMLConverter(codeCase.ast).convert(); }
  catch (error) { codeXmlError = String(error && error.message || error); }
  check('xml: конвертер не падает на фрагменте кода',
    !codeXmlError && codeXml.includes('Процедура Тест()'), codeXmlError);

  const PROTO_CODE = join('! as proto', 'order', '  .code ```bsl', 'Процедура Тест()', '```');
  let codeProto = '';
  let codeProtoError = '';
  try { codeProto = new YarbpProtoConverter(build(PROTO_CODE).ast).convert(); }
  catch (error) { codeProtoError = String(error && error.message || error); }
  check('proto: конвертер не падает на фрагменте кода',
    !codeProtoError && codeProto.includes('code'), codeProtoError);

  /* ------------------------------------------------------------------ */
  /* 4b. Кейс 44: тройной и одинарный fence, эквивалентность AST          */
  /* ------------------------------------------------------------------ */
  async function fetchText(url) {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error(response.status + ' ' + response.statusText + ': ' + url);
    return (await response.text()).replace(/\r\n?/g, '\n');
  }

  function comparableAst(value) {
    if (Array.isArray(value)) return value.map(comparableAst);
    if (value && typeof value === 'object') {
      const result = {};
      for (const key of Object.keys(value).sort()) {
        if (['position', 'comments', 'directives', '__macroExpanded'].includes(key)) continue;
        result[key] = comparableAst(value[key]);
      }
      return result;
    }
    return value;
  }

  let case44Ok = false;
  let case44Detail = '';
  try {
    const raw = await fetchText('../../notes/cases/44_bsl_code.txt');
    const marker = raw.indexOf('ast должен быть эквивалентен');
    const actualPart = raw.slice(raw.indexOf('! as ast'), marker).trimEnd();
    const expectedPart = raw.slice(raw.indexOf('! as ast', marker)).trimEnd();

    const actualAst = build(actualPart).ast;
    const expectedAst = build(expectedPart).ast;
    const actual = comparableAst(actualAst);
    const expected = comparableAst(expectedAst);

    case44Ok = JSON.stringify(actual) === JSON.stringify(expected);
    if (!case44Ok) {
      case44Detail = 'actual=' + JSON.stringify(actual).slice(0, 260) +
        ' expected=' + JSON.stringify(expected).slice(0, 260);
    }

    const codes = [];
    const collectCodes = (node) => {
      if (!node || typeof node !== 'object') return;
      if (node.valueType === valueTypes.CODE) codes.push(node);
      for (const child of node.children || []) collectCodes(child);
    };
    collectCodes(actualAst);

    check('кейс 44: тройной и одинарный fence дали два CODE-узла',
      codes.length === 2 &&
      codes.some(node => node.language === 'bsl') &&
      codes.some(node => node.language === 'js'),
      codes.map(node => node.language).join(','));
  } catch (error) {
    case44Detail = String(error && error.message || error);
  }

  check('кейс 44: AST эквивалентен разметке из файла', case44Ok, case44Detail);


  /* ------------------------------------------------------------------ */
  /* 5. Подсветка встроенных языков                                      */
  /* ------------------------------------------------------------------ */
  const codeHighlight = build(CODE);
  const sourceHtml = new YarbpHighlighter(CODE, codeHighlight.tokens).highlight();
  const highlightHost = document.createElement('div');
  highlightHost.innerHTML = sourceHtml;

  const block = highlightHost.querySelector('.ide-code-codeblock');
  const body = block && block.querySelector('.ide-code-body');

  check('подсветка: основной проход рисует границы и язык',
    !!block && block.dataset.lang === 'bsl' &&
    block.querySelectorAll('.ide-code-fence').length === 2,
    block ? String(block.dataset.lang) : 'нет блока');
  check('подсветка: текст слоя совпадает с исходником',
    highlightHost.textContent === CODE,
    highlightHost.textContent.length + ' / ' + CODE.length);

  const pass = new CodeBlockHighlightPass(highlightHost, CODE_BLOCK_HIGHLIGHT_DELAY_MS);
  pass.schedule(CODE, codeHighlight.tokens);

  check('подсветка: кулдаун в диапазоне 100–200 мс',
    CODE_BLOCK_HIGHLIGHT_DELAY_MS >= 100 && CODE_BLOCK_HIGHLIGHT_DELAY_MS <= 200,
    String(CODE_BLOCK_HIGHLIGHT_DELAY_MS));
  check('подсветка: до кулдауна языковых классов нет',
    !!body && body.querySelectorAll('.code-bsl-kw').length === 0,
    body ? body.innerHTML.slice(0, 80) : 'нет body');

  pass.highlightNow();

  check('подсветка BSL: ключевые слова найдены',
    !!body && body.querySelectorAll('.code-bsl-kw').length > 0,
    body ? String(body.querySelectorAll('.code-bsl-kw').length) : 'нет body');
  check('подсветка BSL: комментарий и строка найдены',
    !!body && !!body.querySelector('.code-bsl-com') && !!body.querySelector('.code-bsl-str'));

  const bslRichBody = highlightedBody('bsl', [
    '#Область Тест',
    '&НаКлиенте',
    'Процедура Тест(Параметр = 0)',
    '  Число = 123;',
    '  Если Число > 0 Тогда',
    '    Сообщить("ok"); // комментарий',
    '  КонецЕсли;',
    'КонецПроцедуры',
    '#КонецОбласти'
  ]);

  check('подсветка BSL: традиционная схема 1С — все роли',
    !!bslRichBody &&
    !!bslRichBody.querySelector('.code-bsl-kw') &&
    !!bslRichBody.querySelector('.code-bsl-id') &&
    !!bslRichBody.querySelector('.code-bsl-str') &&
    !!bslRichBody.querySelector('.code-bsl-num') &&
    !!bslRichBody.querySelector('.code-bsl-com') &&

  function waitForLoad(frame) {

      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        resolve(true);
      };
      frame.addEventListener('load', finish, { once: true });

        done = true;
        resolve(false);
      }, 10000);
    });
  }

      doc.getElementById('render-textarea').value.includes('bpmn:definitions'));

    /* Рамки директив: соседние строки-директивы получают одну общую рамку,
       разделённые текстом — каждая свою. Рамки живут отдельным слоем, поэтому
       разметка подсветки и текст слоя не меняются. */
    editor.value = join(
      '! как json',
      '! as xml',
      '',
      '.ключ значение',

      '..массив',
      '  ! как json'

    await new Promise(resolve => setTimeout(resolve, 500));

    const framesHost = layer.querySelector('.flavor-frames');
    const origin = framesHost.getBoundingClientRect();
    const fillRects = span => Array.from(span.getClientRects())
      .filter(rect => rect.width || rect.height)
      .map(rect => ({
        left: rect.left - origin.left,
        right: rect.right - origin.left,
        top: rect.top - origin.top,
        bottom: rect.bottom - origin.top,
      }));
    const unionBox = rects => ({
      left: Math.min(...rects.map(rect => rect.left)),
      right: Math.max(...rects.map(rect => rect.right)),
      top: Math.min(...rects.map(rect => rect.top)),
      bottom: Math.max(...rects.map(rect => rect.bottom)),
    });

    const flavors = Array.from(layer.querySelectorAll('.flavor'));
    const fills = flavors.map(fillRects);
    const frames = Array.from(layer.querySelectorAll('.flavor-frame'));
    /* Рамка — `<path>`, поэтому геометрия берётся из `getBBox`, а не из
       `style.left/width`: у многоугольника этих полей нет. Вершины `d` считаем,
       чтобы отличить ступеньку от прямоугольника. */
    const frameBoxes = frames.map(frame => {
      const box = frame.getBBox();
      return {
        left: box.x,
        top: box.y,
        right: box.x + box.width,
        bottom: box.y + box.height,
        vertices: (frame.getAttribute('d').match(/[ML]/g) || []).length,
        contours: (frame.getAttribute('d').match(/M/g) || []).length,
      };
    });
    const expected = [unionBox(fills[0].concat(fills[1])), unionBox(fills[2]), unionBox(fills[3])];
    const close = (first, second) => Math.abs(first - second) < 1;
    const sameBox = (first, second) =>
      close(first.left, second.left) && close(first.right, second.right) &&
      close(first.top, second.top) && close(first.bottom, second.bottom);
    const lineHeight = fills[0][0].bottom - fills[0][0].top;

    check('рамки директив: у соседних строк одна общая рамка, остальные — свои',
      frameBoxes.length === 3 && frames.every(frame => frame.tagName.toLowerCase() === 'path'),
      JSON.stringify(frameBoxes));
    check('рамки директив: подложка соседних строк слита в один контур',
      frameBoxes.length === 3 && frameBoxes.every(box => box.contours === 1),
      JSON.stringify(frameBoxes.map(box => box.contours)));
    check('рамки директив: рамка идёт по краю заливки, а не по её прямоугольнику',
      frameBoxes.length === 3 &&
      frameBoxes.every((box, index) => sameBox(box, expected[index])),
      JSON.stringify({ frames: frameBoxes, expected }));
    check('рамки директив: у строк разной длины рамка ступенькой (многоугольник)',
      frameBoxes.length === 3 &&
      Math.abs((fills[0][0].right - fills[0][0].left) -
        (fills[1][0].right - fills[1][0].left)) > 1 &&
      frameBoxes[0].vertices > 4,
      frameBoxes.length ? frameBoxes[0].vertices + ' вершин' : 'рамок нет');
    check('рамки директив: ступенька стоит на правых краях обеих строк',
      frameBoxes.length === 3 && (() => {
        const corners = frames[0].getAttribute('d')
          .match(/[ML][-\d.]+ [-\d.]+/g)
          .map(item => item.slice(1).split(' ').map(Number));
        const verticals = corners
          .filter((point, index) => point[0] === corners[(index + 1) % corners.length][0])
          .map(point => point[0]);
        const near = value => verticals.some(x => Math.abs(x - value) < 0.5);
        const widthOf = rect => rect.right - rect.left;
        /* Вертикальные стороны: левый край (0) и два правых края строк — три
           штуки. Общий прямоугольник дал бы две. */
        return verticals.length === 3 &&
          near(widthOf(fills[0][0])) && near(widthOf(fills[1][0]));
      })(),
      frames.length ? frames[0].getAttribute('d') : 'рамок нет');
    check('рамки директив: общая рамка накрывает обе строки, одиночная — одну',
      frameBoxes.length === 3 &&
      frameBoxes[0].bottom - frameBoxes[0].top > lineHeight * 1.5 &&
      close(frameBoxes[1].bottom - frameBoxes[1].top, lineHeight) &&
      close(frameBoxes[2].bottom - frameBoxes[2].top, lineHeight),
      JSON.stringify(frameBoxes));
    check('рамки директив: директивы через текст — разные рамки',
      frameBoxes[1].top > frameBoxes[0].top &&
      frameBoxes[2].top > frameBoxes[1].top,
      JSON.stringify(frameBoxes));
    check('рамки директив: рамка учитывает отступ директивы',
      frameBoxes[2].left > 5 && Math.abs(frameBoxes[0].left) < 1,
      JSON.stringify(frameBoxes.map(box => box.left)));
    check('рамки директив: текст слоя подсветки не изменился',
      layer.textContent === editor.value,
      layer.textContent.length + ' / ' + editor.value.length);
    check('рамки директив: в рамках нет текста (только декор)',
      frames.every(frame => frame.textContent === ''));
    check('рамки директив: полотно рамок не обрезает контуры',
      !!framesHost.firstElementChild &&
      view.getComputedStyle(framesHost.firstElementChild).overflow === 'visible',
      framesHost.firstElementChild
        ? view.getComputedStyle(framesHost.firstElementChild).overflow
        : 'нет полотна');
    check('рамки директив: рамка красится цветом директивы',
      frames.length > 0 && view.getComputedStyle(frames[0]).stroke === 'rgb(64, 128, 85)',
      frames.length ? view.getComputedStyle(frames[0]).stroke : 'нет рамки');

    /* Алгоритм контура проверяется и на искусственных прямоугольниках: в
       документе геометрия зависит от шрифта, а ступенька и разрыв должны
       строиться всегда. */
    const stacked = unionOutlines([
      { left: 0, right: 40, top: 0, bottom: 18 },
      { left: 0, right: 60, top: 18, bottom: 36 },
    ]);
    check('рамки директив: контур объединения — ступенька из шести вершин',
      stacked.length === 1 && stacked[0].length === 6,
      JSON.stringify(stacked));
    const gapped = unionOutlines([
      { left: 0, right: 10, top: 0, bottom: 18 },
      { left: 30, right: 40, top: 0, bottom: 18 },
    ]);
    check('рамки директив: разрыв в подложке — два отдельных контура',
      gapped.length === 2 && gapped.every(outline => outline.length === 4),
      JSON.stringify(gapped));

    /* Желобок номеров строк увеличивает левый отступ текста. Слой рамок должен

    const layerPadding = parseFloat(view.getComputedStyle(layer).paddingLeft);
    const framesLeft = framesHost
      ? framesHost.getBoundingClientRect().left - layer.getBoundingClientRect().left +
        layer.scrollLeft
      : NaN;
    check('рамки директив: слой рамок привязан к началу текста с желобком',
      !!framesHost && Math.abs(framesLeft - layerPadding) < 1,
      framesLeft + ' / ' + layerPadding);

    /* Без директив рамок нет вовсе — документ не платит за них. */
    editor.value = join('.ключ значение', '..массив');
    editor.dispatchEvent(new view.Event('input', { bubbles: true }));

      !layer.querySelector('.flavor-frames'),
      layer.innerHTML.slice(0, 80));
  }

    if (Array.isArray(value)) return value.map(plain);
    if (!value || typeof value !== 'object') return value;
    const result = {};
    Object.keys(value).forEach(key => {
      if (['position', 'directives', 'comments', 'origin'].includes(key)) return;
      result[key] = plain(value[key]);
    });
    return result;
  };

    !!sugarNodeA && sugarNodeA.value === undefined &&

  ));

  check('L-2: разделитель «//»',
    child(slashNode, 'имя')?.value === 'Кол-во' &&

  const indentedDirective = build('  ! ');
  const indentedDirectiveToken = indentedDirective.tokens
    .find(token => token.type === TokenTypes.DIRECTIVE);
  check('L-2: отступ перед «! » остаётся вне директивы',
    !!indentedDirectiveToken &&

  const fullDirective = build('! как аст');

  /* ------------------------------------------------------------------ */
  /* 15. L-1: импорт объекта из файла проекта                            */
  /* ------------------------------------------------------------------ */
  const buildWithImport = (code, files) => {
    const lexer = new YarbpLexer();
    lexer.setInitialState(code);
    lexer.tokenize();
    const parser = new YarbpParser(lexer);
    parser.setImportResolver(key => {
      const value = files[key];
      if (typeof value === 'string') {
        return { ok: true, id: key, name: key, content: value };
      }
      return value || { ok: false, reason: 'missing', candidates: Object.keys(files) };
    }, () => 0);
    return { ast: parser.getAST(), parser };
  };

  const macroBody = child(macroOrder, 'шаблон');
  check('L-1: макросы файла-источника раскрыты до импорта',
    child(macroBody, 'номер')?.value === 7,
    macroOrder ? JSON.stringify(plain(macroOrder)) : 'нет объекта');

  const evilImport = buildWithImport(join(
    '! как форма',
    '! импорт злой из evil'
  ), {
    evil: join(
      '! как форма',
      'злой',
      '  поле = <img src=x onerror=alert(1)>'
    )
  });
  const evilHtml = new UIGenerator(false).generateHTML(evilImport.ast);
  check('L-1: импортированное значение экранируется',
    !evilHtml.includes('<img') && evilHtml.includes('&lt;img'),
    evilHtml.slice(0, 200));

  const afterContent = buildWithImport(join(
    '! as ast',
    'первый = 1',
    '! импорт форма из tsd-form'
  ), { 'tsd-form': TSD_SOURCE });
  const afterKeys = children(afterContent.ast).map(node => node.key);
  check('L-1: объект вставлен в позицию директивы',
    afterKeys.indexOf('первый') < afterKeys.indexOf('форма'),
    JSON.stringify(afterKeys));

  /* ------------------------------------------------------------------ */
  /* Предопределённый пример UI-формы: стартовый файл и папка «Примеры»  */
  /* ------------------------------------------------------------------ */
  const exampleData = new FileManager('yarbp_features_examples')._getDefaultData();
  const formExample = exampleData.files.find(file => file.slug === 'ui-order-form');
  check('UI: пример формы есть в «Примерах»',
    !!formExample && !!formExample.isBuiltin,
    formExample ? formExample.name : 'нет примера');
  check('UI: пример формы открывается сразу',
    !!formExample && exampleData.activeFileId === formExample.id,
    String(exampleData.activeFileId));

  const exampleManager = new FileManager('yarbp_features_examples_link');
  const linkedExample = exampleManager._findBuiltinByKey('ui-order-form');
  check('UI: ссылка «?example=ui-order-form» ведёт на пример',
    !!linkedExample && linkedExample.id === 'builtin-10',
    linkedExample ? linkedExample.id : 'пример не найден по slug');

  const exampleGenerator = new UIGenerator(false);
  let exampleIr = null;
  let exampleHtml = '';
  let exampleError = '';
  try {
    const exampleParsed = build(formExample ? formExample.content : '');
    exampleIr = exampleGenerator.convert(exampleParsed.ast);
    exampleHtml = exampleGenerator.generateHTML(exampleParsed.ast);
  } catch (error) {
    exampleError = String(error && error.stack || error);
  }

  const exampleDiagnostics = exampleIr ? exampleIr.diagnostics : [];
  check('UI: пример формы разбирается без замечаний',
    !!exampleIr && exampleDiagnostics.length === 0,
    exampleError || exampleDiagnostics
      .map(item => item.code + ': ' + item.text).join('; '));

  check('UI: в примере нет .код — разметка остаётся чистой', 
    !!exampleIr && exampleIr.handlers.length === 0 &&
    !exampleHtml.includes('data-handler='),
    exampleIr ? String(exampleIr.handlers.length) : 'нет IR');

  const exampleHost = document.createElement('div');
  exampleHost.innerHTML = exampleHtml;
  document.body.appendChild(exampleHost);
  const exampleRuntime = new UIRuntime(exampleHost);
  exampleRuntime.mount();

  const exampleCards = exampleHost.querySelectorAll('.fieldset-card');
  const examplePlateRows = exampleHost.querySelectorAll('.order-card .info-row');
  const exampleTotal = exampleHost.querySelectorAll('.order-card .total-row');
  const exampleListItems = exampleHost.querySelectorAll('.items-list .list-item');
  const exampleViews = exampleHost.querySelectorAll('.list-view, .form-view');
  const exampleSubmit = exampleHost.querySelector('button[type="submit"]');

  check('UI: в примере пять карточек и две плашки', 
    exampleCards.length === 5 && exampleHost.querySelectorAll('.order-card').length === 2 &&
    examplePlateRows.length === 7,
    'cards=' + exampleCards.length + ', rows=' + examplePlateRows.length);
  check('UI: строка «Статус» в примере — итоговая', 
    exampleTotal.length === 1 && exampleTotal[0].textContent.includes('Заполняется'),
    String(exampleTotal.length));
  check('UI: в примере шесть строк списков', 
    exampleListItems.length === 6, String(exampleListItems.length));
  check('UI: в примере три пары представлений', 
    exampleHost.querySelectorAll('.list-view').length === 3 &&
    exampleHost.querySelectorAll('.form-view').length === 3 &&
    exampleViews.length === 6,
    String(exampleViews.length));
  check('UI: в примере кнопка отправки', 
    !!exampleSubmit && exampleSubmit.textContent.includes('Отправить отчёт о выработке'),
    exampleSubmit ? exampleSubmit.textContent.trim() : 'нет кнопки');
  check('UI: в примере очистка штрихкода и постфикс в подписи', 
    exampleHost.querySelectorAll('[data-clear]').length === 1 &&
    Array.from(exampleHost.querySelectorAll('.input-group label'))
      .some(node => node.textContent.includes('(шт.)')),
    'clears=' + exampleHost.querySelectorAll('[data-clear]').length);
  check('UI: переключатель показывает условный блок', 
    exampleHost.querySelectorAll('.dynamic-block.is-visible').length === 1 &&
    exampleHost.querySelectorAll('.dynamic-block').length === 3,
    'visible=' + exampleHost.querySelectorAll('.dynamic-block.is-visible').length);

  exampleRuntime.destroy();
  exampleHost.remove();

  // Результат уже записан до UI-блока — обновляем, чтобы новые проверки
  // попали в отчёт, а не только в title.
  resultBox.textContent = lines.join('\n') + '\n';
  document.title = failed ? 'FEATURES FAIL' : 'FEATURES PASS';
</script>
</body>
</html>
