<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>converters cases</title>
  <style>
    body { margin: 0; padding: 16px; background: #ffffff; color: #111111;
      font: 12px/1.5 'JetBrains Mono', Consolas, monospace; }
    #result { margin: 0; white-space: pre-wrap; }
  </style>
</head>
<body>
<pre id="result">running...</pre>

<script>
  /* Диагностика: ошибка модуля (синтаксис/импорт) видна в дампе страницы. */
  window.addEventListener('error', (event) => {
    const box = document.getElementById('result');
    if (!box) return;
    box.textContent = 'LOAD ERROR: ' + (event.message || '') +
      ' @ ' + (event.filename || '') + ':' + (event.lineno || '');
  });
</script>

<script type="module">
  /*
   * Smoke-тесты конвертеров: разметка → AST → артефакт.
   *
   * Проверяется не побайтовое совпадение, а контракт: конвертер не падает,
   * отдаёт непустой результат ожидаемого вида и не теряет значения из
   * разметки. До этого набора конвертеры (в том числе ~1900 строк BPMN и
   * 1700 строк XPM) не проверялись ничем, кроме глаз.
   */
  import { YarbpLexer } from '../../src/js/classes/YarbpLexer.js';
  import { YarbpParser } from '../../src/js/classes/YarbpParser.js';
  import { YarbpJSONConverter } from '../../src/js/classes/ast-converters/JSONConvertor.js';
  import { YarbpXMLConverter } from '../../src/js/classes/ast-converters/XMLConvertor.js';
  import { YarbpProtoConverter } from '../../src/js/classes/ast-converters/ProtobufConvertor.js';
  import { YarbpBPMNConverter } from '../../src/js/classes/ast-converters/bpmn/YarbpBPMNConverter.js';
  import { YarbpFlexFormsConverter } from '../../src/js/classes/ast-converters/FlexFormsConvertor.js';
  import { UIGenerator } from '../../src/js/classes/UIGenerator.js';
  import { YarbpFlavor } from '../../src/js/classes/YarbpFlavor.js';
  import { BPMNRenderer } from '../../src/js/classes/renderers/BPMNRenderer.js';
  import { XMLHighlighter } from '../../src/js/classes/highlighters/XMLHighlighter.js';
  import { FileManager } from '../../src/js/modules/FileManager.js';

  const resultBox = document.getElementById('result');
  const lines = [];
  let failed = 0;

  function check(name, ok, detail = '') {
    if (!ok) failed++;
    lines.push((ok ? 'ok   ' : 'FAIL ') + name + (ok || !detail ? '' : ' — ' + detail));
  }

  function buildAST(code) {
    const lexer = new YarbpLexer();
    lexer.setInitialState(code);
    lexer.tokenize();
    return { ast: new YarbpParser(lexer).getAST(), tokens: lexer.tokens };
  }

  function parseXml(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    return { doc, error: doc.querySelector('parsererror') };
  }

  /* Данные заказа: та же разметка, что во встроенном примере «JSON». */
  const ORDER = [
    '! as json',
    ':',
    '  .order_id 12345',
    '  .status "new"',
    '  .is_active yes',
    "  :client .first_name Jack .last_name White .id '54312'",
    '  ..items',
    '    : .sku ART-001 .price 1299.99'
  ].join('\n');

  const orderAST = buildAST(ORDER).ast;

  /* ------------------------------------------------------------------ */
  /* 1. JSON                                                             */
  /* ------------------------------------------------------------------ */
  let json = null;
  try {
    json = new YarbpJSONConverter(orderAST).convert();
  } catch (e) {
    check('json: конвертер не падает', false, String(e && e.message || e));
  }

  check('json: результат — объект', !!json && typeof json === 'object');
  check('json: числа остаются числами',
    !!json && json.order_id === 12345 && typeof json.order_id === 'number',
    json ? typeof json.order_id : 'нет');
  check('json: булево из «yes»', !!json && json.is_active === true);
  check('json: вложенный объект',
    !!json && !!json.client && json.client.first_name === 'Jack' &&
    json.client.id === '54312');
  check('json: массив из вложенного объекта',
    !!json && Array.isArray(json.items) && json.items.length === 1 &&
    json.items[0].sku === 'ART-001' && json.items[0].price === 1299.99);

  let jsonGuard = false;
  try { new YarbpJSONConverter(null).convert(); } catch (e) { jsonGuard = true; }
  check('json: пустой AST отклоняется', jsonGuard);

  /* ------------------------------------------------------------------ */
  /* 2. XML                                                              */
  /*    Корень именованный: у анонимного (`:` сверху) корневого тега нет,   */
  /*    и текст получается из нескольких элементов — это не документ.      */
  /* ------------------------------------------------------------------ */
  const XML_DOC = [
    '! as xml',
    'order',
    '  .order_id 12345',
    '  .status "new"',
    '  .client',
    '    .first_name Jack'
  ].join('\n');

  let xml = '';
  let xmlError = '';
  try {
    xml = new YarbpXMLConverter(buildAST(XML_DOC).ast).convert();
  } catch (e) {
    xmlError = String(e && e.message || e);
  }

  check('xml: конвертер не падает', !xmlError, xmlError);
  check('xml: результат не пустой', typeof xml === 'string' && xml.length > 0);
  check('xml: корень из разметки на месте',
    xml.includes('<order') && xml.includes('12345') && xml.includes('Jack'),
    xml.slice(0, 160));

  const xmlParsed = xml ? parseXml(xml) : { error: 'нет результата' };
  check('xml: разбирается XML-парсером без ошибки',
    !xmlParsed.error,
    xmlParsed.error ? String(xmlParsed.error.textContent || '').slice(0, 120) : '');

  /* ------------------------------------------------------------------ */
  /* 3. Protobuf                                                         */
  /* ------------------------------------------------------------------ */
  const PROTO_DOC = [
    '! as proto',
    'client',
    '  .first_name Jack',
    '  .last_name White',
    '  .id 54312'
  ].join('\n');

  let proto = '';
  let protoError = '';
  try {
    proto = new YarbpProtoConverter(buildAST(PROTO_DOC).ast).convert();
  } catch (e) {
    protoError = String(e && e.message || e);
  }

  check('proto: конвертер не падает', !protoError, protoError);
  check('proto: результат не пустой', typeof proto === 'string' && proto.length > 0);
  check('proto: поля объекта описаны в схеме',
    proto.includes('first_name') && proto.includes('last_name'),
    proto.slice(0, 160));

  // Наблюдение (не требование): у массива объектов элементы описываются
  // пустым message — поля элемента в схему не попадают. Требование не
  // выставляем: неясно, задумано ли так, вопрос к владельцу.
  let orderProto = '';
  try { orderProto = new YarbpProtoConverter(orderAST).convert(); } catch (e) { /* пусто */ }
  if (/message\s+\w+\s*\{\s*\}/.test(orderProto)) {
    lines.push('skip proto: поля элемента массива не попадают в схему (message пустой) — наблюдение для владельца');
  } else {
    check('proto: поля элемента массива описаны', orderProto.length > 0);
  }

  /* ------------------------------------------------------------------ */
  /* 4. UI-макет                                                         */
  /* ------------------------------------------------------------------ */
  let uiHTML = '';
  let uiError = '';
  try {
    uiHTML = new UIGenerator(false).generateHTML(orderAST);
  } catch (e) {
    uiError = String(e && e.message || e);
  }

  check('ui: генератор не падает', !uiError, uiError);
  check('ui: результат не пустой и без «undefined»',
    typeof uiHTML === 'string' && uiHTML.length > 0 && !uiHTML.includes('undefined'),
    String(uiHTML).slice(0, 120));

  /* ------------------------------------------------------------------ */
  /* 5. BPMN                                                             */
  /* ------------------------------------------------------------------ */
  const bpmnDoc = [
    '! как бпмн',
    ':',
    '  .имя Заказ',
    '  операция',
    '    .имя Подобрать товар',
    '    .исполнитель Кладовщик',
    '  операция',
    '    .имя Подтвердить',
    '    .исполнитель Менеджер'
  ].join('\n');

  let bpmn = '';
  let bpmnError = '';
  try {
    bpmn = new YarbpBPMNConverter(buildAST(bpmnDoc).ast).convert();
  } catch (e) {
    bpmnError = String(e && e.message || e);
  }

  check('bpmn: конвертер не падает', !bpmnError, bpmnError);
  check('bpmn: результат — XML-документ',
    typeof bpmn === 'string' && bpmn.length > 0 && bpmn.includes('definitions'),
    String(bpmn).slice(0, 120));

  const bpmnParsed = bpmn ? parseXml(bpmn) : { error: 'нет результата' };
  check('bpmn: разбирается XML-парсером без ошибки',
    !bpmnParsed.error,
    bpmnParsed.error ? String(bpmnParsed.error.textContent || '').slice(0, 120) : '');

  /* ------------------------------------------------------------------ */
  /* 6. Форма-ТСД: разметка встроенного примера → IR                     */
  /* ------------------------------------------------------------------ */
  const defaults = new FileManager('yarbp_converters_test')._getDefaultData();
  const tsdExample = defaults.files.find(file => file.id === 'builtin-9');

  check('flexforms: встроенный пример найден', !!tsdExample,
    defaults.files.map(file => file.id).join(','));

  if (tsdExample) {
    let ir = null;
    let irError = '';
    try {
      ir = new YarbpFlexFormsConverter(buildAST(tsdExample.content).ast).convert();
    } catch (e) {
      irError = String(e && e.message || e);
    }

    check('flexforms: конвертер не падает', !irError, irError);
    check('flexforms: корень IR — форма', !!ir && ir.type === 'форма',
      ir ? String(ir.type) : 'нет IR');
    check('flexforms: операции на месте',
      !!ir && Array.isArray(ir.children) && ir.children.length > 0,
      ir ? String((ir.children || []).length) : '');
    check('flexforms: у операции есть поля',
      !!ir && !!ir.children && Array.isArray(ir.children[0].children) &&
      ir.children[0].children.length > 0);
  }

  /* ------------------------------------------------------------------ */
  /* 7. Директивы флейвора: регистр, пробелы, дефисы (D-06)               */
  /* ------------------------------------------------------------------ */
  const flavorName = (directive) => new YarbpFlavor(directive).flavorName;

  check('флейвор: регистр не важен («! как JSON» перестал быть неизвестным)',
    flavorName('как JSON') === 'json', String(flavorName('как JSON')));
  check('флейвор: «! AS xml»',
    flavorName(' AS  xml ') === 'xml', String(flavorName(' AS  xml ')));
  check('флейвор: дефис вместо пробела',
    flavorName('as-proto') === 'proto', String(flavorName('as-proto')));
  check('флейвор: «! как  Форма-ТСД» находит рендерер',
    flavorName('как  Форма-ТСД') === 'форматсд' &&
    !!new YarbpFlavor('как  Форма-ТСД').flavorData,
    String(flavorName('как  Форма-ТСД')));
  check('флейвор: подчёркивание в имени',
    flavorName('как_бпмн') === 'бпмн', String(flavorName('как_бпмн')));
  check('флейвор: без «as/как» — не флейвор',
    flavorName('json') === undefined);
  check('флейвор: «assert» не считается «as»',
    flavorName('assert json') === undefined);
  check('флейвор: директива без имени не распознаётся',
    flavorName('as') === undefined);

  /* ------------------------------------------------------------------ */
  /* 8. Рендерер BPMN: тикер вместо рендера на каждый ввод + кнопки      */
  /* ------------------------------------------------------------------ */
  const renderPane = document.createElement('div');
  renderPane.id = 'render-pane';
  const renderHost = document.createElement('div');
  renderHost.className = 'editor-container';
  const renderTextarea = document.createElement('textarea');
  const renderHighlight = document.createElement('div');
  renderHost.append(renderHighlight, renderTextarea);
  renderPane.append(renderHost);
  document.body.append(renderPane);

  const bpmnCode = [
    '! как бпмн',
    'процесс = Заказ',
    '  событие = Начало',
    '  задача = Подобрать товар',
    '  задача = Подтвердить'
  ].join('\n');

  const bpmnLexer = new YarbpLexer();
  bpmnLexer.setInitialState(bpmnCode);
  bpmnLexer.tokenize();
  const bpmnParser = new YarbpParser(bpmnLexer);
  const bpmnRenderer = new BPMNRenderer(
    bpmnLexer, bpmnParser, renderTextarea, renderHighlight, () => {});

  bpmnRenderer.render();
  check('BPMN: первая отрисовка сразу (панель не пустует)',
    renderTextarea.value.includes('<bpmn:process') &&
    renderTextarea.value.includes('Подобрать товар'),
    renderTextarea.value.slice(0, 60));

  const refreshBtn = renderPane.querySelector('.bpmn-refresh-btn');
  const downloadBtn = renderPane.querySelector('.bpmn-download-btn');
  check('BPMN: кнопки «обновить» и «скачать» на месте',
    !!refreshBtn && !!downloadBtn &&
    refreshBtn.getAttribute('aria-label') === 'Обновить схему BPMN');
  check('BPMN: кнопки не дублируются при повторной отрисовке',
    (bpmnRenderer.renderNow(), renderPane.querySelectorAll('.bpmn-refresh-btn').length === 1 &&
      renderPane.querySelectorAll('.bpmn-download-btn').length === 1));

  // Меняем документ: теперь перерисовка должна ждать паузу (2 с), а не идти
  // на каждое изменение.
  const firstXML = renderTextarea.value;
  bpmnLexer.setInitialState(bpmnCode.replace('Подтвердить', 'Подтвердить заказ'));
  bpmnLexer.tokenize();
  bpmnRenderer.render();

  check('BPMN: по вводу схема сразу не пересобирается',
    renderTextarea.value === firstXML);
  check('BPMN: кнопка обновления помечает устаревшую схему',
    !!refreshBtn && refreshBtn.classList.contains('is-stale'));

  bpmnRenderer.renderNow();
  check('BPMN: кнопка обновления пересобирает схему немедленно',
    renderTextarea.value.includes('Подтвердить заказ'));
  check('BPMN: метка устаревания снимается после отрисовки',
    !!refreshBtn && !refreshBtn.classList.contains('is-stale'));

  // Клик по кнопке — не только вид: он должен снять ожидание и пересобрать.
  bpmnLexer.setInitialState(bpmnCode.replace('Подобрать товар', 'Подобрать товар (клик)'));
  bpmnLexer.tokenize();
  bpmnRenderer.render();
  refreshBtn.click();
  check('BPMN: клик по «обновить» пересобирает схему сразу',
    renderTextarea.value.includes('Подобрать товар (клик)'),
    renderTextarea.value.slice(0, 80));

  // Тема/раскладка просят перерисовку без нового документа — работы быть не
  // должно: массив токенов тот же.
  const stableXML = renderTextarea.value;
  bpmnRenderer.render();
  check('BPMN: перерисовка без изменения документа ничего не планирует',
    renderTextarea.value === stableXML && !refreshBtn.classList.contains('is-stale'));

  bpmnRenderer.destroy();
  check('BPMN: destroy убирает кнопки',
    renderPane.querySelectorAll('.bpmn-refresh-btn, .bpmn-download-btn, .bpmn-actions')
      .length === 0);

  renderPane.remove();

  /* ------------------------------------------------------------------ */
  /* 9. Бенчмарк конвертера: как растёт время с размером схемы           */
  /* ------------------------------------------------------------------ */
  function bigBpmnDoc(stepCount) {
    const lines = ['! как бпмн', 'процесс = Большой', '  событие = Начало'];
    for (let index = 0; index < stepCount; index++) {
      lines.push('  задача = Шаг ' + (index + 1));
      if (index % 5 === 4) {
        lines.push('  шлюз = Развилка ' + (index + 1));
        lines.push('    ветка = А');
        lines.push('      задача = Вариант А' + (index + 1));
        lines.push('    ветка = Б');
        lines.push('      задача = Вариант Б' + (index + 1));
      }
    }
    return lines.join('\n');
  }

  const timings = [];
  for (const size of [10, 20, 40, 80]) {
    const code = bigBpmnDoc(size);
    const ast = buildAST(code).ast;
    const started = performance.now();
    const xml = new YarbpBPMNConverter(ast).convert();
    const elapsed = performance.now() - started;

    const highlightStarted = performance.now();
    new XMLHighlighter(xml).highlight();
    const highlightElapsed = performance.now() - highlightStarted;

    timings.push(size + ' шагов: сборка ' + elapsed.toFixed(0) +
      ' мс, подсветка ' + highlightElapsed.toFixed(0) + ' мс');
    check('бенчмарк BPMN (' + size + ' шагов): схема собрана',
      xml.includes('<bpmn:process') && xml.includes('Шаг ' + size) &&
      xml.length > 500,
      xml.length + ' символов');

    // Очень щедрый предел: ловим не «медленно», а катастрофу (квадратичный
    // обрыв или бесконечный цикл в раскладке).
    check('бенчмарк BPMN (' + size + ' шагов): уложились в 5 с',
      elapsed < 5000, elapsed.toFixed(0) + ' мс');
  }

  lines.push('info замеры конвертера — ' + timings.join('; '));

  // Наблюдение: имя процесса/узла берётся из значения после «=»; без него
  // модель собирается, но имена теряются молча.
  const noEqXml = new YarbpBPMNConverter(
    buildAST(['! как бпмн', 'процесс П', '  задача X'].join('\n')).ast).convert();
  if (!noEqXml.includes('name="П"')) {
    lines.push('info BPMN: без «=» имена теряются молча (модель при этом собирается)');
  }

  /* ------------------------------------------------------------------ */
  /* 10. Golden-снимки BPMN XML (B-2)                                    */
  /*     Фиксирует текущее поведение конвертера: правки раскладки,       */
  /*     порядка DI и сериализации не должны проходить незаметно.         */
  /*     Пересъёмка: python tests/converters/run_tests.py --update        */
  /* ------------------------------------------------------------------ */
  const UPDATE = new URLSearchParams(location.search).has('update');

  async function fetchText(url) {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error(response.status + ' ' + response.statusText + ': ' + url);
    // Кейсы в репозитории могут быть с CRLF (git autocrlf): лексер ждёт LF,
    // иначе `\r` попадает в токены. Приводим к LF, как это делают раннеры.
    return (await response.text()).replace(/\r\n?/g, '\n');
  }

  /** Сколько чего в документе: и в модели, и в DI. */
  const STAT_TAGS = {
    processes: ['bpmn:process'],
    tasks: ['bpmn:task', 'bpmn:serviceTask', 'bpmn:userTask', 'bpmn:manualTask',
      'bpmn:scriptTask', 'bpmn:sendTask', 'bpmn:receiveTask', 'bpmn:businessRuleTask'],
    gateways: ['bpmn:exclusiveGateway', 'bpmn:parallelGateway'],
    events: ['bpmn:startEvent', 'bpmn:endEvent', 'bpmn:intermediateThrowEvent',
      'bpmn:boundaryEvent'],
    flows: ['bpmn:sequenceFlow'],
    lanes: ['bpmn:lane'],
    annotations: ['bpmn:textAnnotation'],
    dataObjects: ['bpmn:dataObjectReference'],
    shapes: ['bpmndi:BPMNShape'],
    edges: ['bpmndi:BPMNEdge'],
    waypoints: ['di:waypoint']
  };

  function countTags(xml, tags) {
    let total = 0;
    for (const tag of tags) {
      const pattern = new RegExp('<' + tag + '[\\s/>]', 'g');
      total += (xml.match(pattern) || []).length;
    }
    return total;
  }

  function bpmnStats(xml) {
    const stats = {};
    for (const [name, tags] of Object.entries(STAT_TAGS)) {
      stats[name] = countTags(xml, tags);
    }
    return stats;
  }

  /** Первое расхождение двух строк — чтобы в логе было видно, где именно. */
  function firstDifference(expected, actual) {
    const length = Math.min(expected.length, actual.length);
    for (let index = 0; index < length; index++) {
      if (expected[index] !== actual[index]) {
        return 'символ ' + index + ': ожидалось «' +
          expected.slice(index, index + 40).replace(/\n/g, '\\n') + '», получено «' +
          actual.slice(index, index + 40).replace(/\n/g, '\\n') + '»';
      }
    }
    return 'длина ' + actual.length + ' вместо ' + expected.length;
  }

  const goldenOut = {};
  let caseNames = [];
  try {
    caseNames = (JSON.parse(await fetchText('cases.json')).files) || [];
  } catch (e) {
    check('golden: список кейсов прочитан', false, String(e && e.message || e));
  }

  for (const name of caseNames) {
    let source = '';
    try {
      source = await fetchText('cases/' + name + '.yarbp');
    } catch (e) {
      check('golden ' + name + ': исходник прочитан', false, String(e && e.message || e));
      continue;
    }

    const xml = new YarbpBPMNConverter(buildAST(source).ast).convert();
    const stats = bpmnStats(xml);

    if (UPDATE) {
      goldenOut[name] = { source: name, stats, xml };
      lines.push('ok   golden ' + name + ': снимок снят (' + xml.length + ' символов)');
      continue;
    }

    let golden = null;
    try {
      golden = JSON.parse(await fetchText('golden/' + name + '.json'));
    } catch (e) {
      check('golden ' + name + ': снимок найден', false,
        String(e && e.message || e) + ' — запустите с --update');
      continue;
    }

    check('golden ' + name + ': XML совпадает с текущим поведением',
      golden.xml === xml, firstDifference(golden.xml || '', xml));
    check('golden ' + name + ': состав модели и DI совпадает',
      JSON.stringify(golden.stats) === JSON.stringify(stats),
      JSON.stringify(golden.stats) + ' ≠ ' + JSON.stringify(stats));
  }

  if (UPDATE) {
    const pre = document.createElement('pre');
    pre.id = 'golden';
    pre.hidden = true;
    pre.textContent = JSON.stringify(goldenOut);
    document.body.appendChild(pre);
  }

  /* ------------------------------------------------------------------ */
  /* 11. Пример из readme — целиком (B-0)                                */
  /*     Пустые строки и CRLF во входных данных больше не ломают         */
  /*     документ, а шлюз внутри задачи разбирается как цепочка.         */
  /* ------------------------------------------------------------------ */
  let readmeSource = '';
  try {
    readmeSource = await fetchText('cases/bpmn_readme_example.yarbp');
  } catch (e) { /* ниже */ }

  if (readmeSource) {
    const readmeXml = new YarbpBPMNConverter(buildAST(readmeSource).ast).convert();
    const readmeStats = bpmnStats(readmeXml);

    check('B-0: пример из readme собирается целиком',
      readmeStats.processes === 1 && readmeStats.tasks >= 2 &&
      readmeStats.gateways === 1 && readmeStats.flows >= 4,
      JSON.stringify(readmeStats));
  }

  /* ------------------------------------------------------------------ */
  /* 12. B-1: диагностика сборки BPMN                                    */
  /*     Конвертер сообщает, что не понял: неизвестный узел, дубль id,    */
  /*     узел без входящего потока, процесс без старта, «.имя» у задачи.  */
  /* ------------------------------------------------------------------ */
  const warningsOf = (code) => {
    const converter = new YarbpBPMNConverter(buildAST(code).ast, { source: code });
    converter.convert();
    return converter.warnings;
  };

  const cleanDoc = ['! как бпмн', 'процесс = П', '  событие = Старт',
    '  задача = Дело', '  событие .расположение конец'].join('\n');
  const cleanWarnings = warningsOf(cleanDoc);
  check('B-1: у корректной схемы предупреждений нет', cleanWarnings.length === 0,
    JSON.stringify(cleanWarnings));

  const typoWarnings = warningsOf(['! как бпмн', 'процесс = П', '  событие = Старт',
    '  задачя = Опечатка'].join('\n'));
  check('B-1: неизвестный узел назван и со строкой',
    typoWarnings.some(item => /неизвестный узел «задачя»/.test(item.message) && item.line === 4),
    JSON.stringify(typoWarnings));

  const dupWarnings = warningsOf(['! как бпмн', 'процесс = П', '  событие = Старт',
    '  задача = А .ид same', '  задача = Б .ид same'].join('\n'));
  check('B-1: дубль идентификатора виден',
    dupWarnings.some(item => /уже занят/.test(item.message)), JSON.stringify(dupWarnings));

  const noStartWarnings = warningsOf(['! как бпмн', 'процесс = П', '  задача = Дело'].join('\n'));
  check('B-1: процесс без старта виден',
    noStartWarnings.some(item => /нет стартового события/.test(item.message)),
    JSON.stringify(noStartWarnings));
  check('B-1: узел без входящего потока виден',
    noStartWarnings.some(item => /нет входящего потока/.test(item.message)),
    JSON.stringify(noStartWarnings));

  const nameWarnings = warningsOf(['! как бпмн', 'процесс = П', '  событие = Старт',
    '  задача = Дело', '    .имя Из ребёнка'].join('\n'));
  check('B-1: подсказка про «.имя» у задачи',
    nameWarnings.some(item => /\.имя игнорируется/.test(item.message)),
    JSON.stringify(nameWarnings));

  /* Панель показывает диагностику строкой под схемой. */
  const warnPane = document.createElement('div');
  warnPane.id = 'render-pane';
  const warnHost = document.createElement('div');
  warnHost.className = 'editor-container';
  const warnTextarea = document.createElement('textarea');
  const warnHighlight = document.createElement('div');
  warnHost.append(warnHighlight, warnTextarea);
  warnPane.append(warnHost);
  document.body.append(warnPane);

  const badCode = ['! как бпмн', 'процесс = П', '  событие = Старт', '  задачя = Опечатка'].join('\n');
  const warnLexer = new YarbpLexer();
  warnLexer.setInitialState(badCode);
  warnLexer.tokenize();
  const warnRenderer = new BPMNRenderer(
    warnLexer, new YarbpParser(warnLexer), warnTextarea, warnHighlight, () => {});
  warnRenderer.render();

  const statusBox = warnPane.querySelector('.bpmn-status');
  check('B-1: панель показывает диагностику со строкой',
    !!statusBox && statusBox.hidden === false &&
    /неизвестный узел «задачя»/.test(statusBox.textContent) &&
    /строка 4/.test(statusBox.textContent),
    statusBox ? statusBox.textContent : 'нет строки статуса');

  warnRenderer.destroy();
  check('B-1: destroy убирает строку статуса',
    warnPane.querySelectorAll('.bpmn-status').length === 0);
  warnPane.remove();

  /* ------------------------------------------------------------------ */
  resultBox.textContent = lines.join('\n') + '\n';
  document.title = UPDATE ? 'CONVERTERS UPDATE'
    : (failed ? 'CONVERTERS FAIL' : 'CONVERTERS PASS');
</script>
</body>
</html>
